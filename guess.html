<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>你画我猜 · Party Draw</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f9fc,#eef3ff);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;min-height:100vh}
.wrap{width:min(1180px,94vw);margin:22px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{font-size:30px;font-weight:950}.brand small{font-size:12px;color:#71809b;display:block;margin-top:2px}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#fff;border:1px solid #e2e8f2;border-radius:999px;padding:8px 12px;font-weight:800;box-shadow:0 5px 16px #26385912}
.grid{display:grid;grid-template-columns:235px 1fr 270px;gap:14px}.panel,.board{background:#fff;border:1px solid #e4e9f2;border-radius:22px;box-shadow:0 14px 45px #26385912}.panel{padding:15px}.board{padding:15px}.panel h3{margin:0 0 12px;font-size:15px}.players{display:grid;gap:8px}.player{display:flex;align-items:center;gap:9px;padding:9px;border-radius:13px;background:#f6f8fc}.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#e8efff;font-size:20px}.player b{font-size:13px}.score{margin-left:auto;font-weight:900}.host{font-size:10px;color:#687795}.timer{text-align:center;font-size:42px;font-weight:1000;line-height:1;margin:4px 0 12px}.timer.danger{color:#e94c5b}.topic{text-align:center;background:#f4f7fb;border:1px dashed #ccd5e4;border-radius:14px;padding:10px;font-size:12px}.topic b{display:block;font-size:20px;margin-top:4px}.canvaswrap{position:relative;background:#f9fbff;border-radius:18px;overflow:hidden;border:1px solid #e6ebf4}.canvaswrap:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 35px #4866a10a}.canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;cursor:crosshair}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#eef2f8;color:#26324a;font-weight:850;cursor:pointer}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.primary{background:#526ff0;color:#fff}.danger{background:#fff0f1;color:#d43e4d}.color{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d6ddea;cursor:pointer}.active{box-shadow:0 0 0 3px #526ff055}.chat{height:360px;overflow:auto;background:#f7f9fc;border-radius:15px;padding:10px}.msg{margin:6px 0;font-size:12px;line-height:1.45}.msg b{color:#526ff0}.guess{display:flex;gap:7px;margin-top:9px}.guess input,.room input{min-width:0;flex:1;border:1px solid #dce3ef;border-radius:12px;padding:10px 11px;outline:none}.status{text-align:center;color:#6e7c96;font-size:11px;margin-top:9px}.room{display:grid;gap:8px}.roomcode{font-size:25px;font-weight:1000;letter-spacing:5px;text-align:center;background:#f4f6ff;border-radius:14px;padding:10px}.rules{font-size:11px;color:#75829a;line-height:1.7}.modal{position:fixed;inset:0;background:#10182c99;backdrop-filter:blur(8px);display:grid;place-items:center;z-index:5}.modal.hide{display:none}.box{width:min(520px,90vw);background:#fff;border-radius:25px;padding:28px;text-align:center;box-shadow:0 30px 90px #10182c44}.choices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:15px 0}.choice{padding:13px 16px;background:#f1f4ff;border:1px solid #dce4ff;border-radius:14px;font-weight:900;cursor:pointer}.notice{padding:10px;border-radius:13px;background:#fff8e9;color:#80611c;font-size:12px;margin-bottom:10px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}.chat{height:220px}.top{align-items:flex-start;flex-direction:column}.chips{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">🎨 你画我猜 <span style="color:#526ff0">Party Draw</span></div><small>4–8人在线派对 · 每题60秒 · 猜中得分 · 连击奖励</small></div><div class="chips"><span class="chip">👥 <span id="pc">1</span>/8</span><span class="chip">🏆 <span id="round">1</span> 回合</span><span class="chip">🔥 <span id="combo">0</span> 连击</span></div></div>
<div class="grid">
<aside class="panel"><h3>👥 玩家</h3><div class="players" id="players"></div><hr style="border:0;border-top:1px solid #edf0f5;margin:14px 0"><h3>🏠 房间</h3><div class="room"><button class="btn primary" id="create">创建房间</button><div id="joinbox"><input id="roominput" placeholder="输入房间号"><button class="btn" id="join">加入</button></div><div class="roomcode" id="roomcode">——</div><button class="btn" id="copy">复制房间号</button></div><div class="status" id="net">未连接</div></aside>
<main class="board"><div class="timer" id="timer">60</div><div class="topic" id="topic">等待房主开始<span style="opacity:.55">（每局随机词语）</span><b>🎲 准备好了吗？</b></div><div class="canvaswrap"><canvas id="canvas" class="canvas" width="800" height="600"></canvas></div>
<div class="tools" id="tools"><button class="btn" id="clear">🧹 清空</button><button class="btn" id="eraser">橡皮擦</button><button class="btn" id="minus">−</button><button class="btn" id="plus">+</button><span class="color active" data-c="#172033" style="background:#172033"></span><span class="color" data-c="#e94c5b" style="background:#e94c5b"></span><span class="color" data-c="#f3a82e" style="background:#f3a82e"></span><span class="color" data-c="#49b97a" style="background:#49b97a"></span><span class="color" data-c="#526ff0" style="background:#526ff0"></span><span class="color" data-c="#9b5de5" style="background:#9b5de5"></span></div>
<div class="status" id="drawstatus">加入房间后开始游戏</div></main>
<aside class="panel"><h3>💬 猜词聊天</h3><div class="chat" id="chat"></div><div class="guess"><input id="guess" placeholder="输入你的答案…" maxlength="30"><button class="btn primary" id="send">发送</button></div><div class="rules">规则：画家看到词语，其他玩家看不到。猜中越快分越高；连续猜中可获得连击加成。</div></aside>
</div></div>
<div class="modal" id="modal"><div class="box"><div style="font-size:58px">🎉</div><h2 id="mt">游戏开始</h2><p id="mx">等待房主开始第一局。</p><div class="choices" id="choices"></div><button class="btn primary" id="close">知道了</button></div></div>
<script>
const $=id=>document.getElementById(id), cvs=$('canvas'),ctx=cvs.getContext('2d');
const words=['苹果','火箭','恐龙','汉堡','篮球','雨伞','机器人','蛋糕','海盗船','宇航员','猫咪','城堡','飞机','冰淇淋','吉他','太阳镜','企鹅','魔法棒','自行车','西瓜','鲸鱼','雪人','皇冠','章鱼','披萨','灯塔','狮子','奶茶','地铁','书包','相机','彩虹','火山','仙人掌','钢琴','小熊','眼镜','蜗牛','月亮','咖啡杯','拖拉机','潜水员','蘑菇','风筝','热气球','龙卷风','机器人狗','宝箱','忍者','向日葵'];
let peer=null,host=false,room='',conns=[],state={players:{},round:1,drawer:null,word:'',end:0,started:false,guessed:[]},me='P'+Math.random().toString(36).slice(2,7),name='玩家'+Math.floor(Math.random()*90+10),color='#172033',size=5,drawing=false,last=null;
const emojis=['😀','😎','🐱','🐻','🐼','🦊','🐸','🐵'];
$('players').innerHTML='';
function addChat(text,who='系统'){let d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+who+'</b>：'+text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function render(){let ps=Object.values(state.players);$('pc').textContent=ps.length;$('round').textContent=state.round||1;$('combo').textContent=Math.max(0,(state.guessed||[]).length);$('players').innerHTML=ps.map((p,i)=>'<div class="player"><div class="avatar">'+(p.avatar||emojis[i%emojis.length])+'</div><b>'+p.name+(p.id===state.drawer?' ✏️':'')+'<span class="host">'+(p.id===state.drawer?' 画家':'')+'</span></b><span class="score">'+p.score+'</span></div>').join('');if(state.started){let left=Math.max(0,Math.ceil((state.end-Date.now())/1000));$('timer').textContent=left;$('timer').classList.toggle('danger',left<=10);if(left===0&&host)finish()}}
function sync(){broadcast({t:'state',s:state})}
function broadcast(m){conns=conns.filter(c=>c.open);conns.forEach(c=>c.send(m))}
function send(m){if(host)handle(m, null);else conns[0]?.send(m)}
function handle(m,c){if(m.t==='join'&&host){if(Object.keys(state.players).length>=8)return c.send({t:'full'});state.players[m.p.id]=m.p;conns.push(c);c.send({t:'state',s:state});broadcast({t:'notice',x:m.p.name+' 加入了房间'});render();return}
if(m.t==='guess'){let p=state.players[m.id];if(!p||!state.started||m.id===state.drawer||state.guessed.includes(m.id))return;if(m.text.trim()===state.word){let left=Math.max(1,Math.ceil((state.end-Date.now())/1000));p.score+=Math.round(100+left*3+state.guessed.length*10);state.guessed.push(m.id);broadcast({t:'correct',name:p.name,word:state.word});if(state.guessed.length>=Object.keys(state.players).length-1)finish();else sync()}else broadcast({t:'chat',name:p.name,text:m.text})}
if(m.t==='stroke'){drawLine(m.a,m.b,m.c,m.z)}if(m.t==='clear'){clearCanvas(false)}if(m.t==='start'&&host)startRound()}
function connectHost(){peer=new Peer();peer.on('open',id=>{$('roomcode').textContent=id.slice(-6).toUpperCase();room=id;$('net').textContent='房主在线 · 把房间号发给朋友';state.players[me]={id:me,name,score:0,avatar:emojis[0]};render()});peer.on('connection',c=>{c.on('data',m=>handle(m,c));c.on('open',()=>{if(!conns.includes(c))conns.push(c)})})}
function joinRoom(id){peer=new Peer();peer.on('open',()=>{let c=peer.connect(id);c.on('open',()=>{conns=[c];c.send({t:'join',p:{id:me,name,score:0,avatar:emojis[Math.floor(Math.random()*emojis.length)]}});$('net').textContent='已连接 · 等待房主开始'});c.on('data',m=>receive(m))});peer.on('error',e=>{$('net').textContent='连接失败，请检查房间号'})}
function receive(m){if(m.t==='state'){state=m.s;render();if(state.started){$('topic').innerHTML=state.drawer===me?'🎨 你的题目<b>'+state.word+'</b>':'🤔 猜猜看！<b>画家正在创作…</b>';}}if(m.t==='stroke')drawLine(m.a,m.b,m.c,m.z);if(m.t==='clear')clearCanvas(false);if(m.t==='chat')addChat(m.text,m.name);if(m.t==='correct'){addChat('🎯 猜中啦！答案是「'+m.word+'」',m.name);if(m.name!==name)state.guessed.push(m.id)}if(m.t==='notice')addChat(m.x);if(m.t==='full')alert('房间已满（最多8人）');render()}
function startRound(){if(Object.keys(state.players).length<4){addChat('至少需要4名玩家才能开始');return}state.started=true;state.guessed=[];state.drawer=Object.keys(state.players)[(state.round-1)%Object.keys(state.players).length];state.word=words[Math.floor(Math.random()*words.length)];state.end=Date.now()+60000;clearCanvas(false);broadcast({t:'clear'});sync();updateTopic();addChat('第 '+state.round+' 局开始！');}
function finish(){if(!state.started)return;state.started=false;let p=state.players[state.drawer];if(p)p.score+=Math.max(10,20-state.guessed.length*2);sync();$('mt').textContent='⏰ 本局结束';$('mx').textContent='答案是「'+state.word+'」';$('modal').classList.remove('hide');$('choices').innerHTML='';if(host)setTimeout(()=>{state.round++;startRound();$('modal').classList.add('hide')},2500)}
function updateTopic(){$('topic').innerHTML=state.drawer===me?'🎨 你的题目<b>'+state.word+'</b>':'🤔 猜猜看！<b>画家正在创作…</b>';render()}
function drawLine(a,b,c,z){ctx.strokeStyle=z?'#fff':c;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function clearCanvas(sendit=true){ctx.clearRect(0,0,cvs.width,cvs.height);if(sendit)send({t:'clear'})}
cvs.addEventListener('pointerdown',e=>{if(state.drawer!==me)return;drawing=true;last=pos(e)});cvs.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);drawLine(last,p,color,false);send({t:'stroke',a:last,b:p,c:color,z:false});last=p});window.addEventListener('pointerup',()=>drawing=false);
function pos(e){let r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)*cvs.width/r.width,y:(e.clientY-r.top)*cvs.height/r.height}}
$('clear').onclick=()=>{if(state.drawer===me)clearCanvas(true)};$('minus').onclick=()=>size=Math.max(2,size-2);$('plus').onclick=()=>size=Math.min(25,size+2);$('eraser').onclick=()=>{color='#fff'};document.querySelectorAll('.color').forEach(x=>x.onclick=()=>{color=x.dataset.c;document.querySelectorAll('.color').forEach(y=>y.classList.remove('active'));x.classList.add('active')});
function guess(){let t=$('guess').value.trim();if(!t)return;$('guess').value='';if(t===state.word&&state.drawer!==me){send({t:'guess',id:me,text:t})}else{addChat(t,name);send({t:'guess',id:me,text:t})}}$('send').onclick=guess;$('guess').onkeydown=e=>{if(e.key==='Enter')guess()};
$('create').onclick=()=>{host=true;connectHost();$('create').textContent='房间已创建';$('create').disabled=true};
$('join').onclick=()=>{let x=$('roominput').value.trim();if(x)joinRoom(x)};
$('copy').onclick=async()=>{if(room)await navigator.clipboard.writeText(room);addChat('房间号已复制')};
$('close').onclick=()=>{$('modal').classList.add('hide')};
setInterval(render,250);addChat('欢迎来到你画我猜！创建房间后邀请 3–7 位朋友。');
</script>
</body></html>
