<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>你画我猜 · Party Draw 豪华版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7f9ff,#edf3ff);color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1240px,95vw);margin:18px auto 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{font-size:31px;font-weight:1000;letter-spacing:-1px}.brand span{color:#536ff1}.sub{font-size:12px;color:#74819a;margin-top:2px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #e0e6f0;border-radius:999px;padding:8px 12px;font-weight:850;box-shadow:0 5px 18px #27385d12}.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 285px;gap:14px}.panel,.board{background:#fff;border:1px solid #e2e8f1;border-radius:23px;box-shadow:0 16px 55px #27385d12}.panel{padding:15px}.board{padding:15px}.panel h3{margin:0 0 11px;font-size:15px}.players{display:grid;gap:7px}.player{display:flex;align-items:center;gap:8px;padding:8px;border-radius:13px;background:#f6f8fc}.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#e9efff;font-size:19px}.player b{font-size:12px}.pmeta{font-size:9px;color:#77839b;display:block}.score{margin-left:auto;font-weight:950}.kick{border:0;background:#ffecef;color:#d23e4d;border-radius:8px;padding:5px;cursor:pointer}.timer{text-align:center;font-size:43px;line-height:1;font-weight:1000;margin:2px 0 10px}.timer.danger{color:#e84d5b}.topic{text-align:center;background:#f4f7fb;border:1px dashed #cbd5e5;border-radius:15px;padding:9px;font-size:12px;margin-bottom:10px}.topic b{display:block;font-size:21px;margin-top:3px}.canvaswrap{border:1px solid #e4e9f2;border-radius:19px;overflow:hidden;background:#fff}.canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;cursor:crosshair}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:11px;padding:9px 12px;background:#eef2f8;color:#28344b;font-weight:850;cursor:pointer}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.primary{background:#536ff1;color:#fff}.green{background:#43ad78;color:#fff}.gold{background:#f0ad35;color:#fff}.red{background:#fff0f1;color:#d13f4d}.color{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d4dbe7;cursor:pointer}.active{box-shadow:0 0 0 3px #536ff155}.chat{height:315px;overflow:auto;background:#f7f9fc;border-radius:15px;padding:9px}.msg{font-size:12px;line-height:1.45;margin:5px 0}.msg b{color:#536ff1}.guess{display:flex;gap:6px;margin-top:8px}.guess input,.room input,.nameinput{min-width:0;flex:1;border:1px solid #d9e1ed;border-radius:11px;padding:9px 10px;outline:none}.room{display:grid;gap:7px}.roomcode{font-size:23px;letter-spacing:4px;font-weight:1000;text-align:center;background:#f3f6ff;border-radius:13px;padding:9px}.row{display:flex;gap:7px}.row>*{flex:1}.status{text-align:center;font-size:10px;color:#73809a;margin-top:8px}.tabs{display:flex;gap:6px;margin-top:12px}.tab{flex:1}.hidden{display:none!important}.settings{font-size:11px;line-height:1.8;color:#6f7c94}.settings label{display:flex;justify-content:space-between;align-items:center}.settings select{border:1px solid #dbe2ed;border-radius:8px;padding:5px}.items{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.item{padding:9px;border-radius:12px;background:#f7f9fd;border:1px solid #e7ebf2;text-align:center;font-size:11px}.item button{margin-top:6px}.modal{position:fixed;inset:0;background:#10182c99;backdrop-filter:blur(8px);display:grid;place-items:center;z-index:10}.modal.hide{display:none}.box{width:min(570px,91vw);background:#fff;border-radius:25px;padding:27px;text-align:center;box-shadow:0 30px 100px #10182c55}.choices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:15px 0}.choice{padding:12px 15px;background:#f2f5ff;border:1px solid #dce4ff;border-radius:14px;font-weight:900;cursor:pointer}.leaderboard{display:grid;gap:6px;text-align:left}.rank{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:#f6f8fc;font-size:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(30px);background:#172033;color:#fff;padding:10px 15px;border-radius:999px;font-weight:800;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.combo{font-weight:1000;color:#e68d20}.event{padding:9px;border-radius:12px;background:#fff7e8;color:#805d18;font-size:11px;margin-top:8px}.ready{width:20px;height:20px;border-radius:50%;border:0;background:#e4e9f2;cursor:pointer}.ready.on{background:#45b57c}.badge{font-size:9px;padding:3px 5px;border-radius:6px;background:#e9edff;color:#5268cf}
@media(max-width:980px){.layout{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}.chat{height:230px}.top{align-items:flex-start;flex-direction:column}.chips{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">🎨 你画我猜 <span>Party Draw · 豪华版</span></div><div class="sub">4–8人 · 60秒限时 · 大厅准备 · 轮流画家 · 道具 · 连击 · 事件 · MVP</div></div><div class="chips"><span class="chip">👥 <span id="pc">1</span>/8</span><span class="chip">🏆 第 <span id="round">1</span> 局</span><span class="chip">🔥 <span id="combo">0</span></span><span class="chip">🪙 <span id="coins">0</span></span></div></div>
<div class="layout">
<aside class="panel">
<h3>👥 游戏大厅</h3><div class="players" id="players"></div>
<div class="tabs"><button class="btn primary tab" id="ready">准备</button><button class="btn tab" id="start">开始</button></div>
<div class="status" id="lobby">至少4人，全部准备后房主可开始</div>
<hr style="border:0;border-top:1px solid #edf0f5;margin:14px 0">
<h3>🏠 房间</h3><div class="room"><button class="btn primary" id="create">创建房间</button><div class="row"><input id="roominput" placeholder="房间号"><button class="btn" id="join">加入</button></div><div class="roomcode" id="roomcode">——</div><button class="btn" id="copy">复制房间号</button><input class="nameinput" id="name" maxlength="10" placeholder="你的昵称"><button class="btn" id="setname">保存昵称</button></div><div class="status" id="net">未连接</div>
</aside>
<main class="board">
<div class="timer" id="timer">60</div><div class="topic" id="topic">🎲 等待房主开始<b>准备好了吗？</b></div>
<div class="canvaswrap"><canvas id="canvas" class="canvas" width="800" height="600"></canvas></div>
<div class="tools"><button class="btn" id="clear">🧹 清空</button><button class="btn" id="eraser">橡皮</button><button class="btn" id="minus">−</button><button class="btn" id="plus">+</button><span class="color active" data-c="#172033" style="background:#172033"></span><span class="color" data-c="#e94c5b" style="background:#e94c5b"></span><span class="color" data-c="#f3a82e" style="background:#f3a82e"></span><span class="color" data-c="#49b97a" style="background:#49b97a"></span><span class="color" data-c="#536ff1" style="background:#536ff1"></span><span class="color" data-c="#9b5de5" style="background:#9b5de5"></span></div>
<div class="tools"><button class="btn gold" id="hint">💡 提示</button><button class="btn" id="freeze">❄️ 冻结猜词</button><button class="btn" id="double">✖️ 双倍分</button><button class="btn" id="party">🎉 派对事件</button></div>
<div class="event" id="event">✨ 等待游戏事件</div>
</main>
<aside class="panel">
<h3>💬 猜词区</h3><div class="chat" id="chat"></div><div class="guess"><input id="guess" maxlength="30" placeholder="输入答案…"><button class="btn primary" id="send">发送</button></div>
<h3 style="margin-top:15px">🎒 道具</h3><div class="items"><div class="item">💡 提示<br><b>显示首字</b><br><button class="btn" onclick="useItem('hint')">使用</button></div><div class="item">✖️ 双倍<br><b>下一次+100%</b><br><button class="btn" onclick="useItem('double')">使用</button></div><div class="item">❄️ 冻结<br><b>画家暂停3秒</b><br><button class="btn" onclick="useItem('freeze')">使用</button></div><div class="item">🎉 派对<br><b>随机事件</b><br><button class="btn" onclick="useItem('party')">使用</button></div></div>
<h3 style="margin-top:15px">🏅 本局榜</h3><div id="boardrank"></div>
</aside>
</div></div>
<div class="modal hide" id="modal"><div class="box"><div id="mi" style="font-size:55px">🎉</div><h2 id="mt">本局结束</h2><p id="mx"></p><div class="choices" id="choices"></div><button class="btn primary" id="close">继续</button></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),cvs=$('canvas'),ctx=cvs.getContext('2d');
const WORDS=['苹果','火箭','恐龙','汉堡','篮球','雨伞','机器人','蛋糕','海盗船','宇航员','猫咪','城堡','飞机','冰淇淋','吉他','太阳镜','企鹅','魔法棒','自行车','西瓜','鲸鱼','雪人','皇冠','章鱼','披萨','灯塔','狮子','奶茶','地铁','书包','相机','彩虹','火山','仙人掌','钢琴','小熊','眼镜','蜗牛','月亮','咖啡杯','拖拉机','潜水员','蘑菇','风筝','热气球','龙卷风','机器人狗','宝箱','忍者','向日葵','恐龙蛋','汉堡店','外星人','潜艇','滑板','圣诞树','摩天轮','魔法城堡','太阳系','雷电','冰山','沙漏','望远镜','火锅','奶酪','甜甜圈','熊猫','长颈鹿','章鱼烧','雪地摩托'];
const EM=['😀','😎','🐱','🐻','🐼','🦊','🐸','🐵'];
let peer=null,host=false,room='',conns=[],me='P'+Math.random().toString(36).slice(2,7),name=localStorage.getItem('drawName')||('玩家'+Math.floor(Math.random()*90+10));
let color='#172033',size=5,drawing=false,last=null,ready=false,frozenUntil=0,doubleNext=false;
let state={players:{},round:1,drawer:null,word:'',end:0,started:false,guessed:[],hint:false,event:'等待游戏开始',settings:{time:60}};
$('name').value=name;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function chat(t,w='系统'){let d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+w+'</b>：'+t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function render(){let ps=Object.values(state.players);$('pc').textContent=ps.length;$('round').textContent=state.round;$('combo').textContent=state.guessed.length;$('players').innerHTML=ps.map((p,i)=>'<div class="player"><div class="avatar">'+(p.avatar||EM[i%EM.length])+'</div><div><b>'+p.name+(p.id===state.drawer?' ✏️':'')+'</b><span class="pmeta">'+(p.id===state.drawer?'本局画家':(p.ready?'已准备':'未准备'))+'</span></div><span class="score">'+p.score+'</span>'+(host&&p.id!==me?'<button class="kick" onclick="kick(\''+p.id+'\')">×</button>':'')+'</div>').join('');$('lobby').textContent=ps.length<4?'还差 '+(4-ps.length)+' 人':'玩家 '+ps.filter(p=>p.ready).length+'/'+ps.length+' 已准备';if(state.started){let left=Math.max(0,Math.ceil((state.end-Date.now())/1000));$('timer').textContent=left;$('timer').classList.toggle('danger',left<=10);if(left===0&&host)finish()}else $('timer').textContent='60';let rank=ps.slice().sort((a,b)=>b.score-a.score);$('boardrank').innerHTML=rank.map((p,i)=>'<div class="rank"><span>'+(i+1)+'. '+p.name+'</span><b>'+p.score+'</b></div>').join('')}
function broadcast(m){conns=conns.filter(c=>c.open);conns.forEach(c=>c.send(m))}
function send(m){if(host)handle(m,null);else if(conns[0]?.open)conns[0].send(m)}
function sync(){broadcast({t:'state',s:state})}
function handle(m,c){if(m.t==='join'&&host){if(Object.keys(state.players).length>=8)return c.send({t:'full'});state.players[m.p.id]=m.p;conns.push(c);c.send({t:'state',s:state});broadcast({t:'notice',x:m.p.name+' 加入了大厅'});render();return}
if(m.t==='ready'){if(state.players[m.id])state.players[m.id].ready=m.v;sync();render()}
if(m.t==='kick'&&host){delete state.players[m.id];broadcast({t:'notice',x:'一名玩家被移出房间'});sync();render()}
if(m.t==='guess'){let p=state.players[m.id];if(!p||!state.started||m.id===state.drawer||state.guessed.includes(m.id)||Date.now()<frozenUntil)return;if(m.text.trim()===state.word){let left=Math.max(1,Math.ceil((state.end-Date.now())/1000)),base=100+left*3+state.guessed.length*15,pts=doubleNext?base*2:base;doubleNext=false;p.score+=pts;state.guessed.push(m.id);broadcast({t:'correct',name:p.name,pts,word:state.word,id:m.id});if(state.guessed.length>=Object.keys(state.players).length-1)finish();else sync()}else broadcast({t:'chat',name:p.name,text:m.text})}
if(m.t==='stroke'){if(state.started&&Date.now()>=frozenUntil)drawLine(m.a,m.b,m.c,m.z)}
if(m.t==='clear'){clearCanvas(false)}
if(m.t==='item'&&state.started)applyItem(m.id,m.item)
}
function connectHost(){peer=new Peer();peer.on('open',id=>{room=id;$('roomcode').textContent=id.slice(-6).toUpperCase();$('net').textContent='房主在线 · 邀请朋友加入';state.players[me]={id:me,name,score:0,ready:true,avatar:EM[0]};render()});peer.on('connection',c=>{c.on('data',m=>handle(m,c));c.on('open',()=>{if(!conns.includes(c))conns.push(c)})})}
function joinRoom(id){peer=new Peer();peer.on('open',()=>{let c=peer.connect(id);c.on('open',()=>{conns=[c];c.send({t:'join',p:{id:me,name,score:0,ready:false,avatar:EM[Math.floor(Math.random()*EM.length)]}});$('net').textContent='已连接 · 等待房主开始'});c.on('data',receive)});peer.on('error',()=>{$('net').textContent='连接失败，请检查房间号'})}
function receive(m){if(m.t==='state'){state=m.s;render();updateTopic()}if(m.t==='stroke')drawLine(m.a,m.b,m.c,m.z);if(m.t==='clear')clearCanvas(false);if(m.t==='chat')chat(m.text,m.name);if(m.t==='correct'){chat('🎯 猜中！ +'+m.pts+' 分',m.name);toast(m.name+' 猜中了！ +'+m.pts)}if(m.t==='notice')chat(m.x);if(m.t==='event'){$('event').textContent=m.x;toast(m.x)}if(m.t==='full')alert('房间已满，最多8人');render()}
function updateTopic(){if(!state.started){$('topic').innerHTML='🎲 等待房主开始<b>准备好了吗？</b>';return}$('topic').innerHTML=state.drawer===me?'🎨 轮到你画：<b>'+state.word+'</b>':'🤔 猜猜看！<b>'+((state.hint?state.word[0]+'…':'画家正在创作…'))+'</b>'}
function startGame(){if(!host)return;let ps=Object.values(state.players);if(ps.length<4){toast('至少需要4名玩家');return}if(ps.some(p=>!p.ready)){toast('还有玩家没有准备');return}startRound()}
function startRound(){let ids=Object.keys(state.players);state.started=true;state.guessed=[];state.hint=false;state.drawer=ids[(state.round-1)%ids.length];state.word=WORDS[Math.floor(Math.random()*WORDS.length)];state.end=Date.now()+state.settings.time*1000;frozenUntil=0;doubleNext=false;clearCanvas(false);broadcast({t:'clear'});state.event='🎨 本局开始！画家正在作画';sync();updateTopic();chat('第 '+state.round+' 局开始！');}
function finish(){if(!state.started)return;state.started=false;let p=state.players[state.drawer];if(p)p.score+=Math.max(10,30-state.guessed.length*2);sync();$('mi').textContent='🏆';$('mt').textContent='本局结束';$('mx').textContent='答案是「'+state.word+'」';$('choices').innerHTML='';$('modal').classList.remove('hide');if(host)setTimeout(()=>{state.round++;if(Object.keys(state.players).length>=4)startRound();$('modal').classList.add('hide')},2800)}
function drawLine(a,b,c,z){ctx.strokeStyle=z?'#fff':c;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function clearCanvas(sendit=true){ctx.clearRect(0,0,cvs.width,cvs.height);if(sendit)send({t:'clear'})}
function pos(e){let r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)*cvs.width/r.width,y:(e.clientY-r.top)*cvs.height/r.height}}
cvs.addEventListener('pointerdown',e=>{if(state.drawer!==me||Date.now()<frozenUntil)return;drawing=true;last=pos(e)});cvs.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);drawLine(last,p,color,false);send({t:'stroke',a:last,b:p,c:color,z:false});last=p});window.addEventListener('pointerup',()=>drawing=false);
function useItem(item){if(!state.started){toast('游戏开始后才能使用道具');return}if(item==='hint'&&state.drawer!==me){toast('只有画家能使用提示');return}if(item==='double'&&state.drawer===me){toast('画家不能给自己加双倍');return}send({t:'item',id:me,item})}
function applyItem(id,item){let p=state.players[id];if(!p)return;if(item==='hint'){state.hint=true;state.event='💡 '+p.name+' 使用提示：首字公开';broadcast({t:'event',x:state.event});sync();updateTopic()}else if(item==='double'){doubleNext=true;state.event='✖️ '+p.name+' 激活双倍分：下一位猜中者得分翻倍';broadcast({t:'event',x:state.event});sync()}else if(item==='freeze'){frozenUntil=Date.now()+3000;state.event='❄️ 猜词冻结3秒！';broadcast({t:'event',x:state.event});sync()}else if(item==='party'){let ev=['🎉 反转事件：所有人换位想象！','🌈 彩虹事件：猜中额外+50分！','⚡ 极速事件：剩余时间奖励翻倍！','🤪 搞怪事件：画家必须使用非主色！'][Math.floor(Math.random()*4)];state.event=ev;broadcast({t:'event',x:ev});sync()}}
function kick(id){send({t:'kick',id})}
$('ready').onclick=()=>{ready=!ready;$('ready').textContent=ready?'取消准备':'准备';send({t:'ready',id:me,v:ready})};
$('start').onclick=startGame;$('create').onclick=()=>{host=true;connectHost();$('create').textContent='房间已创建';$('create').disabled=true};$('join').onclick=()=>{let x=$('roominput').value.trim();if(x)joinRoom(x)};$('copy').onclick=async()=>{if(room)await navigator.clipboard.writeText(room);toast('房间号已复制')};
$('setname').onclick=()=>{let n=$('name').value.trim();if(!n)return;name=n;localStorage.setItem('drawName',name);if(state.players[me]){state.players[me].name=name;send({t:'ready',id:me,v:ready})}toast('昵称已保存');render()};
$('send').onclick=()=>{let t=$('guess').value.trim();if(!t)return;$('guess').value='';if(t===state.word&&state.drawer!==me)send({t:'guess',id:me,text:t});else{chat(t,name);send({t:'guess',id:me,text:t})}};$('guess').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
$('clear').onclick=()=>{if(state.drawer===me)clearCanvas(true)};$('minus').onclick=()=>size=Math.max(2,size-2);$('plus').onclick=()=>size=Math.min(25,size+2);$('eraser').onclick=()=>color='#fff';
document.querySelectorAll('.color').forEach(x=>x.onclick=()=>{color=x.dataset.c;document.querySelectorAll('.color').forEach(y=>y.classList.remove('active'));x.classList.add('active')});
$('hint').onclick=()=>useItem('hint');$('freeze').onclick=()=>useItem('freeze');$('double').onclick=()=>useItem('double');$('party').onclick=()=>useItem('party');$('close').onclick=()=>$('modal').classList.add('hide');
document.onkeydown=e=>{if(e.key==='Enter'&&document.activeElement!==$('guess'))$('start').click();if(e.key==='Escape')$('clear').click()};
setInterval(render,250);chat('欢迎！创建房间后邀请3–7位朋友。所有人准备后房主开始。');render();
</script>
</body></html>
