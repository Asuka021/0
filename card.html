<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星界卡战：终极版</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f7f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -15%,#7050a8 0,#241b42 24%,#080b15 58%,#03050b 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 30%,#59bfff0d 0 2px,transparent 3px),radial-gradient(circle at 80% 20%,#ffd45c0c 0 2px,transparent 3px);background-size:150px 150px,190px 190px}.wrap{width:min(1220px,95vw);margin:18px auto 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:8px 4px}.title{font-size:clamp(25px,4vw,38px);font-weight:1000;letter-spacing:-1px;text-shadow:0 5px 25px #000}.sub{margin-top:3px;color:#aeb8d2;font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:8px 12px;border:1px solid #ffffff1c;background:#10172ad9;border-radius:999px;box-shadow:inset 0 1px #fff1}.battle{position:relative;margin-top:14px;padding:18px;background:linear-gradient(180deg,#10192ced,#080d19ed);border:1px solid #ffffff1c;border-radius:28px;box-shadow:0 25px 90px #000b,inset 0 1px #ffffff0c}.battle:before{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:linear-gradient(90deg,transparent,#8f6aff08,transparent)}.arena{display:grid;grid-template-columns:1fr .55fr 1fr;gap:18px;align-items:center}.unit{position:relative;text-align:center;padding:20px 18px;border-radius:22px;background:linear-gradient(145deg,#ffffff0b,#00000016);border:1px solid #ffffff17;box-shadow:0 12px 35px #0005}.unit:after{content:"";position:absolute;inset:-1px;border-radius:22px;pointer-events:none;box-shadow:inset 0 0 25px #ffffff04}.avatar{font-size:76px;line-height:1;filter:drop-shadow(0 12px 16px #0009);transition:.2s}.name{margin-top:9px;font-size:20px;font-weight:950}.bar{height:18px;padding:2px;background:#05070d;border:1px solid #ffffff16;border-radius:99px;overflow:hidden;margin:11px 0 7px;box-shadow:inset 0 2px 5px #000}.hp{height:100%;border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}.ph{background:linear-gradient(90deg,#5af29b,#18b978);box-shadow:0 0 15px #34df8a66}.eh{background:linear-gradient(90deg,#ff7676,#d12464);box-shadow:0 0 15px #ef386766}.intent{display:inline-block;margin-top:4px;padding:7px 12px;background:#3a1c2d;border:1px solid #ff688044;color:#ff9cad;border-radius:999px;font-size:12px;font-weight:900}.mid{text-align:center}.vs{font-size:29px;font-weight:1000;color:#9ba5bf;text-shadow:0 0 18px #fff2}.energy{display:inline-block;margin:13px 0 10px;padding:9px 17px;border-radius:14px;background:#3a2b11;border:1px solid #ffd45c44;color:#ffd45c;font-size:25px;font-weight:1000;box-shadow:0 0 20px #ffd45c16}.map{display:flex;align-items:center;justify-content:center;gap:0;margin:18px 0 4px}.node{position:relative;padding:8px 13px;background:#121d31;border:1px solid #ffffff18;color:#8794b1;font-size:12px;font-weight:850}.node:first-child{border-radius:999px 0 0 999px}.node:last-child{border-radius:0 999px 999px 0}.node:not(:last-child):after{content:"›";position:absolute;right:-7px;top:4px;color:#53617d;z-index:2}.node.current{background:linear-gradient(135deg,#704522,#49301d);border-color:#ffd45c;color:#ffe59a;box-shadow:0 0 20px #ffd45c22}.board{margin-top:12px;padding:17px 12px 14px;background:linear-gradient(180deg,#070b15,#050811);border:1px solid #ffffff13;border-radius:22px;box-shadow:inset 0 1px #fff1}.board:before{content:"你的手牌";display:block;text-align:center;color:#67738d;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:7px}.hand{min-height:225px;display:flex;justify-content:center;align-items:end;gap:11px;flex-wrap:wrap}.card{width:140px;height:207px;padding:10px;border-radius:18px;background:linear-gradient(145deg,#263f6b,#101729 72%);border:1px solid #ffffff30;box-shadow:0 14px 32px #000b,inset 0 1px #ffffff18;cursor:pointer;position:relative;transition:.2s cubic-bezier(.2,.8,.2,1);overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#fff2,transparent 35%,transparent 70%,#fff1);pointer-events:none}.card:hover{transform:translateY(-17px) scale(1.045);border-color:#ffe27a;box-shadow:0 25px 50px #000c,0 0 25px #ffe27a30}.disabled{opacity:.36;filter:grayscale(.45);cursor:not-allowed}.cost{position:absolute;top:8px;left:8px;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#4a89ff,#2050ae);border:2px solid #ffffff33;box-shadow:0 3px 10px #0008;font-size:15px;font-weight:1000}.icon{text-align:center;font-size:45px;margin-top:25px;filter:drop-shadow(0 5px 8px #0008)}.cn{text-align:center;font-size:15px;font-weight:1000}.rarity{text-align:center;font-size:9px;font-weight:850;margin-top:4px;opacity:.85}.desc{text-align:center;font-size:11px;line-height:1.5;margin-top:8px;color:#d8e0f2}.common{border-color:#ffffff45}.rare{border-color:#55baff;box-shadow:0 0 18px #55baff22,0 14px 32px #000b}.epic{border-color:#d16cff;box-shadow:0 0 22px #d16cff27,0 14px 32px #000b}.legend{border-color:#ffd35a;box-shadow:0 0 25px #ffd35a30,0 14px 32px #000b}.controls{text-align:center;margin:13px 0 2px}.btn{border:1px solid #ffffff16;border-radius:13px;padding:10px 16px;margin:4px;color:#eef3ff;background:linear-gradient(180deg,#2d4164,#202e49);font-weight:950;cursor:pointer;box-shadow:0 5px 0 #0a0f19,0 9px 18px #0005;transition:.15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.13)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0a0f19}.hot{background:linear-gradient(180deg,#bd7831,#82491f);border-color:#ffd05a33}.skill{background:linear-gradient(180deg,#93642c,#5e3719);border-color:#ffd76a66;box-shadow:0 0 18px #ffcf4820,0 5px 0 #29180b}.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{padding:15px;background:#0a1020e8;border:1px solid #ffffff14;border-radius:18px}.panel h3{margin:0 0 10px}.shopgrid{display:flex;gap:9px;flex-wrap:wrap}.shopitem{flex:1;min-width:160px;padding:12px;background:#151f35;border:1px solid #ffffff0e;border-radius:14px;text-align:center}.log{height:105px;overflow:auto;margin-top:12px;padding:10px 12px;background:#050811;border:1px solid #ffffff0d;border-radius:15px;font-size:12px;line-height:1.75;color:#b9c3d9}.modal{display:none;position:fixed;inset:0;background:#02040bcc;backdrop-filter:blur(8px);place-items:center;z-index:5}.modal.show{display:grid}.box{width:min(580px,92vw);padding:30px;border-radius:28px;background:linear-gradient(145deg,#172039,#0b101e);border:1px solid #ffffff25;text-align:center;box-shadow:0 35px 120px #000}.choice{cursor:pointer;width:150px;padding:14px;border-radius:17px;background:#17243d;border:1px solid #ffffff20;transition:.18s}.choice:hover{transform:translateY(-8px);border-color:#ffe27a;box-shadow:0 15px 30px #0008}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.shake{animation:shake .35s}.flash{animation:flash .45s}.pop{animation:pop .4s}.float{position:fixed;font-size:31px;font-weight:1000;pointer-events:none;animation:float 1s forwards;z-index:20;text-shadow:0 3px 10px #000}@keyframes shake{25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}@keyframes flash{50%{transform:scale(1.06);filter:brightness(1.9)}}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes float{0%{transform:translateY(0) scale(.7);opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.arena{grid-template-columns:1fr 1fr}.mid{display:none}.card{width:116px;height:184px}.hand{min-height:200px}.panels{grid-template-columns:1fr}}@media(max-width:470px){.arena{grid-template-columns:1fr}.enemy{order:-1}.avatar{font-size:58px}.card{width:104px;height:174px}.icon{font-size:36px}.title{font-size:25px}.node{padding:7px 9px;font-size:10px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">⚔️ 星界卡战 <span style="color:#ffd45c">· 终极版</span></div><div class="sub">30张牌组 · 英雄技能 · 稀有度 · 升级 · 商店 · Boss · 奖励</div></div><div class="stats"><span class="pill">🏆 胜利 <b id="wins">0</b></span><span class="pill">🪙 <b id="gold">80</b></span><span class="pill">⭐ <b id="stars">0</b></span></div></div><div class="battle"><div class="arena"><div class="unit" id="player"><div class="avatar">🧙</div><div class="name">星术师 Lv.<span id="lvl">1</span></div><div class="bar"><div id="php" class="hp ph"></div></div><b><span id="ph">50</span> / 50 HP</b><div id="block"></div><button class="btn skill" id="skill">✨ 英雄技能　2⚡</button></div><div class="mid"><div class="vs">VS</div><div class="energy">⚡ <span id="en">3</span> / 3</div><span class="pill">第 <b id="turn">1</b> 回合</span><br><span class="pill" style="display:inline-block;margin-top:9px">🎴 牌库 <b id="deckn">30</b></span></div><div class="unit enemy" id="enemy"><div class="avatar" id="eavatar">👹</div><div class="name" id="ename">虚空猎手</div><div class="bar"><div id="ehp" class="hp eh"></div></div><b><span id="eh">41</span> / <span id="emax">41</span> HP</b><p><span class="intent" id="intent">意图：攻击 7</span></p></div></div><div class="map" id="map"></div><div class="board"><div class="hand" id="hand"></div></div><div class="controls"><button class="btn" id="draw">🎴 抽牌（1⚡）</button><button class="btn hot" id="end">结束回合 ↵</button><button class="btn" id="new">🔄 新战役</button><button class="btn" id="shopbtn">🛒 商店</button><button class="btn" id="deckbtn">📚 牌组</button></div><div class="panels"><div class="panel" id="shop" style="display:none"><h3>🛒 星界商店</h3><div class="shopgrid" id="shopgrid"></div></div><div class="panel" id="deckpanel" style="display:none"><h3>📚 我的牌组</h3><div id="decklist"></div></div></div><div class="log" id="log"></div></div></div><div class="modal" id="modal"><div class="box pop"><div id="ri" style="font-size:68px">🏆</div><h2 id="rt">胜利！</h2><p id="rx"></p><div class="choices" id="choices"></div><button class="btn hot" id="continue">继续</button></div></div><script>
const C={strike:['烈焰斩','🔥',1,7,'普通','造成伤害'],guard:['星盾','🛡️',1,8,'普通','获得护甲'],frost:['寒霜箭','❄️',1,5,'稀有','5伤害，敌人下次攻击-3'],heal:['星愈术','💚',2,10,'普通','恢复生命'],thunder:['雷霆审判','⚡',2,12,'稀有','造成伤害'],double:['双重打击','🗡️',2,5,'稀有','攻击两次'],meteor:['陨星','☄️',3,20,'史诗','造成巨大伤害'],drain:['灵魂汲取','🩸',2,9,'史诗','伤害并治疗'],nova:['星爆','🌌',4,30,'传说','造成超高伤害']};let up=JSON.parse(localStorage.getItem('up2')||'{}'),wins=+localStorage.getItem('wins2')||0,gold=+localStorage.getItem('gold2')||80,stars=+localStorage.getItem('stars2')||0,g;const $=id=>document.getElementById(id);function save(){localStorage.setItem('up2',JSON.stringify(up));localStorage.setItem('wins2',wins);localStorage.setItem('gold2',gold);localStorage.setItem('stars2',stars);$('wins').textContent=wins;$('gold').textContent=gold;$('stars').textContent=stars;$('lvl').textContent=1+Math.floor(stars/5)}function msg(x){$('log').innerHTML='<div>'+x+'</div>'+$('log').innerHTML}function deck30(){return ['strike','strike','strike','strike','guard','guard','guard','guard','frost','frost','heal','heal','thunder','thunder','double','double','meteor','meteor','drain','drain','nova','strike','guard','frost','heal','thunder','double','meteor','drain','strike']}function enemy(stage){let a=[['👹','虚空猎手',41,7],['🐉','熔岩巨龙',58,9],['🧟','深渊骑士',74,11],['🦇','暗影女王',86,13]];let x=a[Math.min(stage-1,3)];return{icon:x[0],name:x[1],max:x[2]+stage*2,atk:x[3]+stage-1,boss:false}}function newGame(){g={max:50,hp:50,block:0,en:3,turn:1,stage:1,weak:0,over:false,deck:deck30(),discard:[],hand:[],boss:false,e:enemy(1)};$('modal').classList.remove('show');$('log').innerHTML='';draw(5);msg('⚔️ 战斗开始！点击卡牌攻击敌人。');render();map()}function draw(n=1){for(let i=0;i<n;i++){if(!g.deck.length){g.deck=g.discard.splice(0);msg('🔀 弃牌堆洗回牌库。')}if(g.deck.length)g.hand.push(g.deck.splice(Math.floor(Math.random()*g.deck.length),1)[0])}}function dmg(n){if(g.over)return;g.e.hp=Math.max(0,g.e.hp-n);msg('💥 <b>'+n+'</b> 点伤害！敌人剩余 <b>'+g.e.hp+'</b> HP');$('enemy').classList.add('shake');setTimeout(()=>$('enemy').classList.remove('shake'),350);float('-'+n);render();if(g.e.hp<=0)setTimeout(()=>win(),180)}function float(t){let e=document.createElement('div');e.className='float';e.textContent=t;e.style.left='75%';e.style.top='32%';document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}function play(i){if(g.over)return;let id=g.hand[i],c=C[id],lv=up[id]||0;if(c[2]>g.en)return;g.en-=c[2];g.hand.splice(i,1);g.discard.push(id);let v=c[3]+lv*2;msg('🎴 使用【'+c[0]+'】 Lv.'+(lv+1));if(id==='strike'||id==='thunder'||id==='meteor'||id==='nova')dmg(v);else if(id==='guard'){g.block+=c[3]+lv*2;msg('🛡️ 获得 '+g.block+' 护甲')}else if(id==='frost'){dmg(v);if(g.e.hp>0)g.weak=1}else if(id==='heal'){g.hp=Math.min(g.max,g.hp+c[3]+lv*2);msg('💚 恢复生命')}else if(id==='double'){dmg(v);if(g.e.hp>0)dmg(v)}else if(id==='drain'){dmg(v);g.hp=Math.min(g.max,g.hp+5+lv)}render()}function skill(){if(g.over||g.en<2)return;g.en-=2;g.block+=6;dmg(10+g.stage*2);g.hp=Math.min(g.max,g.hp+4);msg('✨ 英雄技能：伤害 +6护甲 +4治疗！');$('player').classList.add('flash');setTimeout(()=>$('player').classList.remove('flash'),450);render()}function end(){if(g.over)return;setTimeout(enemyTurn,350);msg('⏳ 敌人行动……')}function enemyTurn(){if(g.over)return;let n=g.e.atk;if(g.weak){n=Math.max(1,n-3);g.weak=0}if(g.e.boss)n+=Math.floor(g.turn/3);let blocked=Math.min(g.block,n);g.block-=blocked;n-=blocked;if(blocked)msg('🛡️ 护甲抵挡 '+blocked+' 点');if(n){g.hp=Math.max(0,g.hp-n);msg(g.e.icon+' '+g.e.name+' 造成 '+n+' 点伤害')}if(g.hp<=0)return lose();g.turn++;g.en=3;g.block=0;draw(2);render()}function win(){if(g.over)return;g.over=true;wins++;let reward=g.e.boss?100:25+g.stage*5;gold+=reward;stars+=g.e.boss?5:1;save();$('ri').textContent=g.e.boss?'👑':'🏆';$('rt').textContent=g.e.boss?'Boss 击破！':'战斗胜利！';$('rx').textContent='获得 '+reward+' 金币和 '+(g.e.boss?5:1)+' 星。选择一张牌升级。';let ids=[...new Set(g.deck)].sort(()=>Math.random()-.5).slice(0,3);$('choices').innerHTML=ids.map(id=>{let c=C[id],lv=up[id]||0;return '<div class="choice" onclick="upgrade(\''+id+'\')">'+c[1]+' <b>'+c[0]+'</b><br>Lv.'+(lv+1)+' → Lv.'+(lv+2)+'<br><small>'+c[4]+' · 效果+2</small></div>'}).join('');$('continue').textContent='跳过并继续';$('modal').classList.add('show')}function upgrade(id){up[id]=(up[id]||0)+1;save();msg('⭐ '+C[id][0]+' 升级成功！');continueGame()}function continueGame(){if(g.boss)return newGame();g.stage++;g.hp=Math.min(g.max,g.hp+8);g.en=3;g.turn=1;g.hand=[];g.deck=deck30();g.discard=[];g.e=g.stage>=5?{icon:'👑',name:'星界终焉龙',max:120,atk:15,boss:true}:enemy(g.stage);g.boss=g.stage>=5;draw(5);$('modal').classList.remove('show');msg(g.boss?'👑 Boss 战开始！':'🗺️ 进入第 '+g.stage+' 区域。');render();map()}function lose(){g.over=true;$('ri').textContent='💀';$('rt').textContent='战败';$('rx').textContent='这次没有获得奖励，再挑战一次吧！';$('choices').innerHTML='';$('continue').textContent='重新开始';$('modal').classList.add('show')}function render(){if(!g)return;$('ph').textContent=g.hp;$('php').style.width=g.hp/g.max*100+'%';$('eh').textContent=g.e.hp;$('emax').textContent=g.e.max;$('ehp').style.width=Math.max(0,g.e.hp/g.e.max*100)+'%';$('en').textContent=g.en;$('turn').textContent=g.turn;$('deckn').textContent=g.deck.length;$('block').textContent=g.block?'🛡️ 护甲 '+g.block:'';$('eavatar').textContent=g.e.icon;$('ename').textContent=g.e.name;$('intent').textContent='意图：攻击 '+(g.e.atk-(g.weak?3:0));$('hand').innerHTML='';g.hand.forEach((id,i)=>{let c=C[id],lv=up[id]||0,d=document.createElement('div'),cls={普通:'common',稀有:'rare',史诗:'epic',传说:'legend'}[c[4]];d.className='card '+cls+(c[2]>g.en?' disabled':'');d.innerHTML='<div class="cost">'+c[2]+'</div><div class="icon">'+c[1]+'</div><div class="cn">'+c[0]+'</div><div class="rarity">'+c[4]+' · Lv.'+(lv+1)+'</div><div class="desc">'+c[5]+'<br>升级 +'+(lv*2)+'</div>';d.onclick=()=>play(i);$('hand').appendChild(d)})}function map(){let s='';for(let i=1;i<=5;i++)s+='<span class="node '+(i===g.stage?'current':'')+'">'+(i===5?'👑 Boss':'⚔️ '+i)+'</span>';$('map').innerHTML=s}function shop(){let list=[['heal',20],['frost',30],['meteor',55],['nova',90]];$('shop').style.display=$('shop').style.display==='none'?'block':'none';$('shopgrid').innerHTML=list.map(x=>'<div class="shopitem">'+C[x[0]][1]+' <b>'+C[x[0]][0]+'</b><br>🪙 '+x[1]+' <button class="btn" onclick="buy(\''+x[0]+'\','+x[1]+')">购买</button></div>').join('')}function buy(id,cost){if(gold<cost)return msg('🪙 金币不足！');gold-=cost;g.deck.push(id);save();msg('🛒 获得【'+C[id][0]+'】！');render()}function deckview(){$('deckpanel').style.display=$('deckpanel').style.display==='none'?'block':'none';let m={};g.deck.forEach(x=>m[x]=(m[x]||0)+1);$('decklist').innerHTML=Object.entries(m).map(([id,n])=>{let c=C[id],lv=up[id]||0;return c[1]+' '+c[0]+' ×'+n+' · '+c[4]+' · Lv.'+(lv+1)}).join('<br>')}$('skill').onclick=skill;$('end').onclick=end;$('new').onclick=newGame;$('draw').onclick=()=>{if(g.en>0&&!g.over){g.en--;draw();msg('🎴 抽牌');render()}};$('shopbtn').onclick=shop;$('deckbtn').onclick=deckview;$('continue').onclick=()=>{if(g.hp<=0)newGame();else continueGame()};document.onkeydown=e=>{if(e.key==='Enter')end();if(e.key===' ')skill();if(e.key>='1'&&e.key<='9')play(+e.key-1)};save();newGame();</script></body></html>
