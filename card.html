<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星界卡战 · Ultimate</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#4c347d,#0b1020 45%,#04060d);color:#fff;font-family:system-ui,sans-serif;overflow-x:hidden}.wrap{width:min(1200px,96vw);margin:18px auto}.top{display:flex;justify-content:space-between;align-items:end;gap:12px}.title{font-size:31px;font-weight:950}.sub{opacity:.65;font-size:13px}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:7px 10px;border:1px solid #ffffff20;background:#ffffff0b;border-radius:99px}.battle{margin-top:14px;padding:16px;background:#0d1425ed;border:1px solid #ffffff1d;border-radius:24px;box-shadow:0 25px 100px #000b}.arena{display:grid;grid-template-columns:1fr .7fr 1fr;gap:14px;align-items:center}.unit{text-align:center;padding:16px;border-radius:19px;background:linear-gradient(145deg,#ffffff0b,#00000018);border:1px solid #ffffff14}.avatar{font-size:64px;filter:drop-shadow(0 10px 18px #0008)}.name{font-size:19px;font-weight:950}.bar{height:14px;background:#291622;border-radius:99px;overflow:hidden;margin:9px 0}.hp{height:100%;transition:.45s}.ph{background:linear-gradient(90deg,#40e58b,#16a56b)}.eh{background:linear-gradient(90deg,#ff6464,#b92458)}.intent{display:inline-block;padding:6px 10px;background:#391f2e;color:#ff9cad;border-radius:99px;font-size:12px;font-weight:850}.mid{text-align:center}.vs{font-size:26px;font-weight:950;opacity:.55}.energy{font-size:25px;font-weight:950;color:#ffd45c;margin:10px}.skill{border:1px solid #ffe07a!important;background:linear-gradient(145deg,#7b4c1f,#4d2914)!important}.board{margin-top:13px;padding:12px;background:#060914;border:1px solid #ffffff10;border-radius:18px}.hand{min-height:230px;display:flex;justify-content:center;align-items:end;gap:10px;flex-wrap:wrap}.card{width:138px;height:205px;padding:10px;border-radius:16px;background:linear-gradient(145deg,#263e67,#10172b);border:1px solid #ffffff2b;box-shadow:0 12px 28px #0009;cursor:pointer;position:relative;transition:.18s;user-select:none}.card:hover{transform:translateY(-14px) scale(1.03);border-color:#ffe27a;box-shadow:0 20px 45px #000b,0 0 20px #ffe27a44}.disabled{opacity:.4;filter:grayscale(.4);cursor:not-allowed}.cost{position:absolute;top:7px;left:7px;width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:#2e6bd6;font-weight:950}.icon{text-align:center;font-size:42px;margin-top:25px}.cn{text-align:center;font-weight:950;font-size:15px}.desc{text-align:center;font-size:11px;line-height:1.45;margin-top:6px;color:#d7ddee}.tag{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:10px;opacity:.55}.common{border-color:#ffffff35}.rare{border-color:#57b8ff;box-shadow:0 0 14px #57b8ff25}.epic{border-color:#d16cff;box-shadow:0 0 18px #d16cff30}.legend{border-color:#ffd35a;box-shadow:0 0 22px #ffd35a35}.rarity{font-size:9px;text-align:center;margin-top:3px}.controls{text-align:center;margin:10px}.btn{border:0;border-radius:12px;padding:10px 16px;margin:3px;color:#fff;background:#293a5b;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #101827}.btn:active{transform:translateY(3px);box-shadow:none}.hot{background:#a66b27}.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.panel{padding:12px;background:#0a1020;border:1px solid #ffffff14;border-radius:16px}.panel h3{margin:0 0 8px}.shopgrid{display:flex;gap:8px;flex-wrap:wrap}.shopitem{flex:1;min-width:160px;padding:10px;background:#151f35;border-radius:12px;text-align:center}.log{height:105px;overflow:auto;margin-top:10px;padding:9px;background:#050812;border-radius:14px;font-size:12px;line-height:1.7}.reward{display:none;position:fixed;inset:0;background:#000c;place-items:center;z-index:10}.reward.show{display:grid}.box{width:min(560px,92vw);padding:28px;border-radius:24px;background:#11182b;border:1px solid #ffffff2b;text-align:center;box-shadow:0 30px 100px #000}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.choice{width:145px;padding:12px;border-radius:16px;background:#1b2943;border:1px solid #ffffff20;cursor:pointer}.choice:hover{transform:translateY(-7px);border-color:#ffe27a}.map{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.node{padding:8px 12px;border-radius:99px;background:#18243b;border:1px solid #ffffff15}.node.current{background:#704522;border-color:#ffd45c}.flash{animation:flash .45s}@keyframes flash{50%{transform:scale(1.05);filter:brightness(1.8)}}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.pop{animation:pop .45s}@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}@media(max-width:760px){.arena{grid-template-columns:1fr 1fr}.mid{display:none}.card{width:116px;height:180px}.hand{min-height:195px}.panels{grid-template-columns:1fr}}@media(max-width:460px){.arena{grid-template-columns:1fr}.enemy{order:-1}.title{font-size:24px}.card{width:105px;height:170px}.icon{font-size:34px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">⚔️ 星界卡战：终极版</div><div class="sub">30张牌组 · 英雄技能 · 路线 · 商店 · 升级 · Boss</div></div><div class="stats"><div class="pill">🏆 胜利 <b id="wins">0</b></div><div class="pill">🪙 <b id="gold">80</b></div><div class="pill">⭐ <b id="stars">0</b></div></div></div><div class="battle"><div class="arena"><div class="unit" id="player"><div class="avatar">🧙</div><div class="name">星术师 · Lv.<span id="lvl">1</span></div><div class="bar"><div id="php" class="hp ph"></div></div><b><span id="ph">50</span> / 50 HP</b><div id="block"></div><button class="btn skill" id="skill">✨ 英雄技能（2⚡）</button></div><div class="mid"><div class="vs">VS</div><div class="energy">⚡ <span id="en">3</span> / <span id="maxen">3</span></div><div class="pill">第 <b id="turn">1</b> 回合</div><div class="pill" style="margin-top:8px">📜 牌组 <b id="deckn">30</b>/30</div></div><div class="unit enemy" id="enemy"><div class="avatar" id="eavatar">👹</div><div class="name" id="ename">虚空猎手</div><div class="bar"><div id="ehp" class="hp eh"></div></div><b><span id="eh">38</span> / <span id="emax">38</span> HP</b><p><span class="intent" id="intent">意图：攻击 7</span></p></div></div><div class="map" id="map"></div><div class="board"><div class="hand" id="hand"></div></div><div class="controls"><button class="btn" id="draw">🎴 抽牌（1⚡）</button><button class="btn hot" id="end">结束回合 ↵</button><button class="btn" id="new">🔄 新战役</button><button class="btn" id="shopbtn">🛒 商店</button><button class="btn" id="deckbtn">📚 牌组</button></div><div class="panels"><div class="panel" id="shop" style="display:none"><h3>🛒 星界商店</h3><div class="shopgrid" id="shopgrid"></div></div><div class="panel" id="deckpanel" style="display:none"><h3>📚 我的牌组</h3><div id="decklist"></div></div></div><div class="log" id="log"></div></div></div><div class="reward" id="reward"><div class="box pop"><div id="rIcon" style="font-size:62px">🏆</div><h2 id="rTitle">胜利奖励</h2><p id="rText"></p><div class="choices" id="choices"></div><button class="btn hot" id="continue">继续</button></div></div><script>
const baseCards={strike:{n:'烈焰斩',i:'🔥',c:1,d:'造成 7 伤害',r:'普通',fn:g=>hit(7)},guard:{n:'星盾',i:'🛡️',c:1,d:'获得 8 护甲',r:'普通',fn:g=>{g.block+=8;msg('🛡️ 获得 8 护甲。')}},frost:{n:'寒霜箭',i:'❄️',c:1,d:'5伤害；敌人下次攻击-3',r:'稀有',fn:g=>{hit(5);g.weak=1}},heal:{n:'星愈术',i:'💚',c:2,d:'恢复 10 HP',r:'普通',fn:g=>{g.hp=Math.min(g.maxHp,g.hp+10);msg('💚 恢复 10 HP。')}},thunder:{n:'雷霆审判',i:'⚡',c:2,d:'造成 12 伤害',r:'稀有',fn:g=>hit(12)},double:{n:'双重打击',i:'🗡️',c:2,d:'攻击两次，每次5',r:'稀有',fn:g=>{hit(5);if(g.ehp>0)hit(5)}},meteor:{n:'陨星',i:'☄️',c:3,d:'造成 20 伤害',r:'史诗',fn:g=>hit(20)},drain:{n:'灵魂汲取',i:'🩸',c:2,d:'造成 9伤害并恢复 5 HP',r:'史诗',fn:g=>{hit(9);g.hp=Math.min(g.maxHp,g.hp+5)}},nova:{n:'星爆',i:'🌌',c:4,d:'造成 30 伤害',r:'传说',fn:g=>hit(30)}};
const rarityCost={普通:25,稀有:45,史诗:70,传说:120};let upgrades=JSON.parse(localStorage.getItem('cardUpgrades')||'{}');let wins=+localStorage.getItem('cardWins2')||0,gold=+localStorage.getItem('cardGold')||80,stars=+localStorage.getItem('cardStars')||0;const $=x=>document.getElementById(x);let g;
function msg(x){$('log').innerHTML='<div>'+x+'</div>'+$('log').innerHTML}function save(){localStorage.setItem('cardWins2',wins);localStorage.setItem('cardGold',gold);localStorage.setItem('cardStars',stars);localStorage.setItem('cardUpgrades',JSON.stringify(upgrades));$('wins').textContent=wins;$('gold').textContent=gold;$('stars').textContent=stars}function fullDeck(){return ['strike','strike','strike','strike','guard','guard','guard','guard','frost','frost','heal','heal','thunder','thunder','double','double','meteor','meteor','drain','drain','nova','strike','guard','frost','heal','thunder','double','meteor','drain','strike']}
function enemyFor(stage){let a=[['👹','虚空猎手',38,7],['🐉','熔岩巨龙',55,9],['🧟','深渊骑士',68,11],['🦇','暗影女王',78,13]];let x=a[Math.min(stage-1,a.length-1)];return {icon:x[0],name:x[1],hp:x[2]+stage*3,atk:x[3]+stage-1,boss:false}}function newGame(){g={maxHp:50,hp:50,block:0,energy:3,maxEnergy:3,turn:1,stage:1,weak:0,over:false,deck:fullDeck(),hand:[],discard:[],boss:false,enemy:enemyFor(1)};$('reward').classList.remove('show');$('log').innerHTML='';draw(5);msg('⚔️ 战役开始！击败敌人推进路线。');render();renderMap()}
function draw(n=1){for(let i=0;i<n;i++){if(!g.deck.length){g.deck=[...g.discard];g.discard=[];msg('🔀 弃牌堆洗回牌库。')}if(g.deck.length)g.hand.push(g.deck.splice(Math.floor(Math.random()*g.deck.length),1)[0])}}
function cardObj(id){let c=baseCards[id];let up=upgrades[id]||0;return {...c,level:up,damageBonus:up*2}}function hit(n){if(!g||g.over)return;let actual=n;g.ehp=Math.max(0,g.ehp-actual);$('enemy').classList.add('shake');setTimeout(()=>$('enemy').classList.remove('shake'),350);msg('💥 造成 <b>'+actual+'</b> 点伤害！');if(g.ehp<=0)finish(true)}
function play(i){if(g.over)return;let id=g.hand[i],c=cardObj(id);if(c.c>g.energy)return;g.energy-=c.c;g.hand.splice(i,1);g.discard.push(id);msg('🎴 使用【'+c.n+'】 Lv.'+(c.level+1));c.fn(g);render()}
function heroSkill(){if(g.over||g.energy<2)return;g.energy-=2;let gain=4;g.block+=6;hit(10+g.stage*2);g.hp=Math.min(g.maxHp,g.hp+gain);msg('✨ 星界爆发：造成伤害、+6护甲、恢复4HP！');$('player').classList.add('flash');setTimeout(()=>$('player').classList.remove('flash'),450);render()}
function enemyTurn(){if(g.over)return;let n=g.enemy.atk;if(g.weak){n=Math.max(1,n-3);g.weak=0}if(g.enemy.boss)n+=Math.floor(g.turn/3);if(g.block){let a=Math.min(n,g.block);g.block-=a;n-=a;msg('🛡️ 护甲抵挡 '+a+' 点。')}if(n){g.hp=Math.max(0,g.hp-n);msg(g.enemy.icon+' '+g.enemy.name+' 攻击 '+n+' 点！');$('player').classList.add('shake');setTimeout(()=>$('player').classList.remove('shake'),350)}if(g.hp<=0){finish(false);return}g.turn++;g.energy=g.maxEnergy;g.block=0;draw(2);msg('✨ 你的回合：恢复能量，抽2张牌。');render()}
function endTurn(){if(!g.over){msg('⏳ 敌人行动……');setTimeout(enemyTurn,400)}}
function finish(win){if(g.over)return;g.over=true;if(win){wins++;stars+=g.boss?5:1;let reward=g.boss?80:25+g.stage*5;gold+=reward;save();$('rIcon').textContent=g.boss?'👑':'🏆';$('rTitle').textContent=g.boss?'终极 Boss 击破！':'战斗胜利！';$('rText').textContent='获得 '+reward+' 金币与 '+(g.boss?5:1)+' 星。选择一张牌升级或领取额外奖励。';showRewards()}else{$('rIcon').textContent='💀';$('rTitle').textContent='战败';$('rText').textContent='保留金币，重新挑战这条路线吧。';$('choices').innerHTML='';$('continue').textContent='重新开始';$('reward').classList.add('show')}}
function showRewards(){let ids=[...new Set(g.deck)].sort(()=>Math.random()-.5).slice(0,3);$('choices').innerHTML=ids.map(id=>{let c=cardObj(id);return '<div class="choice" data-id="'+id+'"><b>'+c.i+' '+c.n+'</b><br>Lv.'+(c.level+1)+' → Lv.'+(c.level+2)+'<br><small>升级：伤害/效果 +2</small></div>'}).join('');document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{let id=x.dataset.id;upgrades[id]=(upgrades[id]||0)+1;save();msg('⭐ '+baseCards[id].n+' 升级！');$('reward').classList.remove('show');if(g.boss){newGame()}else{nextStage()}});$('continue').textContent='跳过奖励';$('reward').classList.add('show')}
function nextStage(){g.stage++;g.hp=Math.min(g.maxHp,g.hp+8);g.block=0;g.energy=3;g.turn=1;g.hand=[];g.deck=fullDeck();g.discard=[];if(g.stage>=5){g.enemy={icon:'👑',name:'星界终焉龙',hp:120,atk:15,boss:true};g.boss=true;msg('👑 Boss 出现：星界终焉龙！')}else g.enemy=enemyFor(g.stage);draw(5);$('reward').classList.remove('show');msg('🗺️ 进入第 '+g.stage+' 区域。');render();renderMap()}
function render(){if(!g)return;$('ph').textContent=g.hp;$('eh').textContent=g.ehp;$('php').style.width=g.hp/g.maxHp*100+'%';$('ehp').style.width=g.ehp/g.enemy.hp*100+'%';$('en').textContent=g.energy;$('turn').textContent=g.turn;$('deckn').textContent=g.deck.length;$('lvl').textContent=1+Math.floor(stars/5);$('maxen').textContent=g.maxEnergy;$('block').textContent=g.block?'🛡️ 护甲 '+g.block:'';$('eavatar').textContent=g.enemy.icon;$('ename').textContent=g.enemy.name;$('eh').textContent=g.ehp;$('emax').textContent=g.enemy.hp;$('intent').textContent='意图：攻击 '+(g.enemy.atk+(g.weak?-3:0));$('hand').innerHTML='';g.hand.forEach((id,i)=>{let c=cardObj(id),d=document.createElement('div');d.className='card '+({普通:'common',稀有:'rare',史诗:'epic',传说:'legend'}[c.r]||'')+(c.c>g.energy?' disabled':'');d.innerHTML='<div class="cost">'+c.c+'</div><div class="icon">'+c.i+'</div><div class="cn">'+c.n+'</div><div class="rarity">'+c.r+' · Lv.'+(c.level+1)+'</div><div class="desc">'+c.d+(c.level?' · 升级+'+c.level:'')+'</div><div class="tag">按 1-'+Math.min(9,g.hand.length)+' 使用</div>';d.onclick=()=>play(i);$('hand').appendChild(d)})}
function renderMap(){let s='';for(let i=1;i<=5;i++)s+='<span class="node '+(i===g.stage?'current':'')+'">'+(i===5?'👑 Boss':'⚔️ '+i)+'</span>';$('map').innerHTML=s}
function shop(){let items=[['heal','💚 星愈术','恢复卡',20],['frost','❄️ 寒霜箭','攻击卡',30],['meteor','☄️ 陨星','史诗卡',55],['nova','🌌 星爆','传说卡',90]];$('shop').style.display=$('shop').style.display==='none'?'block':'none';$('shopgrid').innerHTML=items.map(a=>'<div class="shopitem"><b>'+a[1]+'</b><br><small>'+a[2]+'</small><br>🪙 '+a[3]+' <button class="btn" onclick="buy(\''+a[0]+'\','+a[3]+')">购买</button></div>').join('')}
function buy(id,cost){if(gold<cost)return msg('🪙 金币不足！');gold-=cost;g.deck.push(id);save();msg('🛒 买入【'+baseCards[id].n+'】加入30+牌组。');render()}
function deckView(){$('deckpanel').style.display=$('deckpanel').style.display==='none'?'block':'none';let counts={};g.deck.forEach(x=>counts[x]=(counts[x]||0)+1);$('decklist').innerHTML=Object.entries(counts).map(([id,n])=>{let c=cardObj(id);return '<div> '+c.i+' <b>'+c.n+'</b> ×'+n+' · '+c.r+' · Lv.'+(c.level+1)+'</div>'}).join('')}
$('skill').onclick=heroSkill;$('end').onclick=endTurn;$('new').onclick=newGame;$('draw').onclick=()=>{if(g.energy>0&&!g.over){g.energy--;draw();msg('🎴 抽到1张牌。');render()}};$('shopbtn').onclick=shop;$('deckbtn').onclick=deckView;$('continue').onclick=()=>{if(g.hp<=0){newGame();return}if(g.boss){newGame();return}nextStage()};document.onkeydown=e=>{if(e.key==='Enter')endTurn();if(e.key===' ')heroSkill();if(e.key>='1'&&e.key<='9')play(+e.key-1)};save();newGame();
</script></body></html>
