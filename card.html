<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星界卡战</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#30456f,#080b15 55%);color:#fff;font-family:system-ui,sans-serif}.wrap{width:min(1100px,96vw);margin:20px auto}.top{display:flex;justify-content:space-between;align-items:end}.title{font-size:30px;font-weight:950}.sub{opacity:.6;font-size:13px}.pill{padding:7px 11px;background:#ffffff10;border:1px solid #ffffff1c;border-radius:99px}.battle{margin-top:14px;padding:18px;background:#0d1425ee;border:1px solid #ffffff1c;border-radius:24px;box-shadow:0 25px 80px #0009}.arena{display:grid;grid-template-columns:1fr .7fr 1fr;gap:15px;align-items:center}.unit{text-align:center;padding:18px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}.avatar{font-size:68px}.name{font-size:19px;font-weight:900}.bar{height:14px;background:#291622;border-radius:99px;overflow:hidden;margin:10px 0}.hp{height:100%;transition:.3s}.ph{background:#35d47c}.eh{background:#e64b64}.intent{display:inline-block;padding:6px 10px;background:#361f2b;color:#ff9cad;border-radius:99px;font-size:12px;font-weight:800}.mid{text-align:center}.vs{font-size:24px;font-weight:950;opacity:.55}.energy{font-size:25px;font-weight:950;color:#ffd45c;margin:12px}.board{margin-top:14px;padding:13px;background:#060914;border:1px solid #ffffff10;border-radius:18px}.hand{min-height:230px;display:flex;justify-content:center;align-items:end;gap:12px;flex-wrap:wrap}.card{width:145px;height:210px;padding:12px;border-radius:16px;background:linear-gradient(145deg,#294267,#10172a);border:1px solid #ffffff2b;box-shadow:0 10px 25px #0008;cursor:pointer;position:relative;transition:.15s}.card:hover{transform:translateY(-10px);border-color:#ffe27a}.disabled{opacity:.4;cursor:not-allowed}.cost{position:absolute;top:8px;left:8px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#3170db;font-weight:950}.icon{text-align:center;font-size:45px;margin-top:28px}.cn{text-align:center;font-weight:950}.desc{text-align:center;font-size:12px;line-height:1.5;margin-top:8px;color:#d5dced}.tag{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;opacity:.55}.controls{text-align:center;margin:12px}.btn{border:0;border-radius:12px;padding:11px 18px;margin:4px;color:#fff;background:#2b3c5e;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #111827}.hot{background:#a76b27}.log{height:105px;overflow:auto;background:#050812;padding:9px;border-radius:14px;font-size:12px;line-height:1.7}.result{display:none;position:fixed;inset:0;background:#000b;place-items:center}.result.show{display:grid}.box{background:#11182b;border:1px solid #ffffff2b;padding:30px;border-radius:24px;text-align:center;width:min(420px,90vw)}@media(max-width:700px){.arena{grid-template-columns:1fr 1fr}.mid{display:none}.card{width:120px;height:180px}.hand{min-height:195px}.icon{font-size:36px}}@media(max-width:450px){.arena{grid-template-columns:1fr}.enemy{order:-1}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">⚔️ 星界卡战</div><div class="sub">抽牌 · 能量 · 连招 · 击败虚空领主</div></div><div class="pill">🏆 胜场 <b id="wins">0</b></div></div><div class="battle"><div class="arena"><div class="unit"><div class="avatar">🧙</div><div class="name">星术师</div><div class="bar"><div id="php" class="hp ph"></div></div><b><span id="ph">40</span> / 40 HP</b><div id="block"></div></div><div class="mid"><div class="vs">VS</div><div class="energy">⚡ <span id="en">3</span> / 3</div><div class="pill">回合 <b id="turn">1</b></div></div><div class="unit enemy"><div class="avatar">👹</div><div class="name">虚空领主</div><div class="bar"><div id="ehp" class="hp eh"></div></div><b><span id="eh">45</span> / 45 HP</b><p><span class="intent" id="intent">意图：攻击 7</span></p></div></div><div class="board"><div class="hand" id="hand"></div></div><div class="controls"><button class="btn" id="draw">🎴 抽牌（1能量）</button><button class="btn hot" id="end">结束回合 ↵</button><button class="btn" id="new">🔄 新战斗</button></div><div class="log" id="log"></div></div></div><div class="result" id="result"><div class="box"><div id="ri" style="font-size:65px">🏆</div><h2 id="rt">胜利！</h2><p id="rx"></p><button class="btn hot" id="again">再来一局</button></div></div><script>
const cards={strike:['烈焰斩','🔥',1,'造成 7 点伤害',g=>hit(7)],guard:['星盾','🛡️',1,'获得 8 点护甲',g=>{g.block+=8;msg('🛡️ 获得 8 点护甲。')}],frost:['寒霜箭','❄️',1,'造成 5 伤害，敌人下次攻击 -3',g=>{hit(5);g.weak=1}],heal:['星愈术','💚',2,'恢复 9 点生命',g=>{g.hp=Math.min(40,g.hp+9);msg('💚 恢复 9 点生命。')}],thunder:['雷霆审判','⚡',2,'造成 12 点伤害',g=>hit(12)],double:['双重打击','🗡️',2,'连续攻击两次，每次 5 点',g=>{hit(5);if(g.ehp>0)hit(5)}],meteor:['陨星','☄️',3,'造成 20 点伤害',g=>hit(20)]};
let g,wins=+localStorage.getItem('cardWins')||0;const $=x=>document.getElementById(x);$('wins').textContent=wins;function msg(x){$('log').innerHTML='<div>'+x+'</div>'+$('log').innerHTML}function newGame(){g={hp:40,ehp:45,block:0,energy:3,turn:1,weak:0,over:false,deck:['strike','strike','guard','guard','frost','heal','thunder','double','meteor'],hand:[]};$('result').classList.remove('show');$('log').innerHTML='';draw(5);msg('⚔️ 战斗开始！点击卡牌出牌。');render()}function draw(n=1){for(let i=0;i<n;i++){if(!g.deck.length)g.deck=['strike','strike','guard','guard','frost','heal','thunder','double','meteor'];g.hand.push(g.deck.splice(Math.floor(Math.random()*g.deck.length),1)[0])}}function hit(n){g.ehp=Math.max(0,g.ehp-n);msg('💥 造成 <b>'+n+'</b> 点伤害！');if(g.ehp<=0)finish(1)}function play(i){if(g.over)return;let id=g.hand[i],c=cards[id];if(c[2]>g.energy)return;g.energy-=c[2];g.hand.splice(i,1);msg('🎴 使用【'+c[0]+'】');c[4](g);render()}function enemyTurn(){if(g.over)return;let n=g.weak?4:7;g.weak=0;if(g.block){let a=Math.min(n,g.block);g.block-=a;n-=a;msg('🛡️ 护甲抵挡 '+a+' 点伤害。')}if(n){g.hp=Math.max(0,g.hp-n);msg('👹 虚空领主攻击 '+n+' 点！')}if(g.hp<=0){finish(0);return}g.turn++;g.energy=3;g.block=0;draw(2);msg('✨ 你的回合：恢复 3 能量，抽 2 张牌。');render()}function endTurn(){if(!g.over){msg('⏳ 敌人行动……');setTimeout(enemyTurn,350)}}function finish(win){if(g.over)return;g.over=true;if(win){wins++;localStorage.setItem('cardWins',wins);$('wins').textContent=wins;$('ri').textContent='🏆';$('rt').textContent='胜利！';$('rx').textContent='虚空领主被击败了！'}else{$('ri').textContent='💀';$('rt').textContent='失败';$('rx').textContent='调整出牌顺序，再战一场！'}setTimeout(()=>$('result').classList.add('show'),250)}function render(){if(!g)return;$('ph').textContent=g.hp;$('eh').textContent=g.ehp;$('php').style.width=g.hp/40*100+'%';$('ehp').style.width=g.ehp/45*100+'%';$('en').textContent=g.energy;$('turn').textContent=g.turn;$('block').textContent=g.block?'🛡️ 护甲 '+g.block:'';$('intent').textContent='意图：攻击 '+(g.weak?4:7);$('hand').innerHTML='';g.hand.forEach((id,i)=>{let c=cards[id],d=document.createElement('div');d.className='card '+(c[2]>g.energy?'disabled':'');d.innerHTML='<div class="cost">'+c[2]+'</div><div class="icon">'+c[1]+'</div><div class="cn">'+c[0]+'</div><div class="desc">'+c[3]+'</div><div class="tag">点击使用</div>';d.onclick=()=>play(i);$('hand').appendChild(d)})}$('draw').onclick=()=>{if(g.energy>0&&!g.over){g.energy--;draw();msg('🎴 额外抽 1 张牌。');render()}};$('end').onclick=endTurn;$('new').onclick=newGame;$('again').onclick=newGame;document.onkeydown=e=>{if(e.key==='Enter')endTurn();if(e.key>='1'&&e.key<='9')play(+e.key-1)};newGame();
</script></body></html>
