<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇 · 升级版</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#203b52,#0b1220 65%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}.wrap{width:min(94vw,560px);text-align:center}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.title{font-size:30px;font-weight:900}.stats{display:flex;gap:16px;font-size:15px;font-weight:700}.stats span{color:#7df2a3}.card{padding:14px;background:#0b1220eF;border:1px solid #38506a;border-radius:20px;box-shadow:0 20px 60px #0008}canvas{display:block;width:100%;height:auto;background:#08111b;border-radius:14px;touch-action:none}.controls{margin-top:14px;display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:7px}.controls button,.actions button{border:0;border-radius:13px;background:#26384a;color:#fff;font-size:24px;font-weight:800;height:56px;cursor:pointer;box-shadow:0 4px 0 #162330}.controls button:active,.actions button:active{transform:translateY(3px);box-shadow:none}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.actions{margin-top:13px;display:flex;gap:10px;justify-content:center}.actions button{height:44px;padding:0 18px;font-size:15px;background:#315b48}.hint{opacity:.7;font-size:13px;margin-top:11px}.badge{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:#203246;font-size:12px;color:#9fc4df}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">🐍 贪吃蛇</div><div class="stats"><div>得分 <span id="score">0</span></div><div>最高 <span id="high">0</span></div><div>等级 <span id="level">1</span></div></div></div>
  <div class="card">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
    <div class="actions"><button id="restart">重新开始</button><button id="pause">暂停</button></div>
    <div class="hint">方向键 / WASD 控制 · 空格暂停 · 手机可直接滑动屏幕</div>
    <div class="badge" id="status">准备出发！</div>
  </div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const N=20,cell=canvas.width/N;let snake,food,dir,nextDir,score,running,gameOver,timer,startX=0,startY=0;
let high=Number(localStorage.getItem('snakeHighScore')||0);document.getElementById('high').textContent=high;
function speed(){return Math.max(55,125-score*2)}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;running=true;gameOver=false;document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;document.getElementById('pause').textContent='暂停';document.getElementById('status').textContent='开始！吃得越多越快';placeFood();clearInterval(timer);timer=setInterval(tick,speed());draw()}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function tick(){if(!running||gameOver)return;dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some((p,i)=>i>0&&p.x===head.x&&p.y===head.y)){gameOver=true;running=false;document.getElementById('status').textContent='撞到了！再来一局吧';draw();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent=score;const level=Math.floor(score/5)+1;document.getElementById('level').textContent=level;if(score>high){high=score;localStorage.setItem('snakeHighScore',high);document.getElementById('high').textContent=high}placeFood();clearInterval(timer);timer=setInterval(tick,speed())}else snake.pop();draw()}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(d&&!(d.x===-dir.x&&d.y===-dir.y))nextDir=d}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#08111b';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff08';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(canvas.width,i*cell);ctx.stroke()}ctx.fillStyle='#ff5b63';ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.34,0,Math.PI*2);ctx.fill();ctx.shadowBlur=12;ctx.shadowColor='#ff5b63';ctx.fill();ctx.shadowBlur=0;snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#b4ffd0':'#35c878';ctx.beginPath();ctx.roundRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4,7);ctx.fill()});if(gameOver||!running){ctx.fillStyle='#0009';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px system-ui';ctx.fillText(gameOver?'游戏结束':'已暂停',canvas.width/2,canvas.height/2-8);ctx.font='18px system-ui';ctx.fillText(gameOver?'点击“重新开始”再挑战':'点击“继续”恢复游戏',canvas.width/2,canvas.height/2+28)}}
function togglePause(){if(gameOver)return;running=!running;document.getElementById('pause').textContent=running?'暂停':'继续';document.getElementById('status').textContent=running?'继续冲分！':'游戏暂停';draw()}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}if(e.key===' '){e.preventDefault();togglePause()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));document.getElementById('pause').onclick=togglePause;document.getElementById('restart').onclick=reset;
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];startX=t.clientX;startY=t.clientY},{passive:true});canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')},{passive:true});
reset();
</script>
</body></html>
