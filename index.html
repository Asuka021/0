<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇 · 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#243f58,#080d16 68%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}.wrap{width:min(94vw,580px);text-align:center}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;gap:10px}.title{font-size:30px;font-weight:900}.stats{display:flex;gap:12px;font-size:14px;font-weight:800;flex-wrap:wrap;justify-content:flex-end}.stats span{color:#7df2a3}.card{padding:14px;background:#0b1220ed;border:1px solid #38506a;border-radius:20px;box-shadow:0 20px 60px #0008}canvas{display:block;width:100%;height:auto;background:#08111b;border-radius:14px;touch-action:none}.bar{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:11px 0 0}.bar button,.controls button,.actions button{border:0;border-radius:12px;background:#26384a;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #162330}.bar button{padding:8px 12px;font-size:12px}.bar button.active{outline:2px solid #7df2a3;background:#315b48}.controls{margin-top:12px;display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:7px}.controls button{font-size:24px;height:56px}.controls button:active,.actions button:active,.bar button:active{transform:translateY(3px);box-shadow:none}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.actions{margin-top:13px;display:flex;gap:10px;justify-content:center}.actions button{height:44px;padding:0 18px;font-size:15px;background:#315b48}.hint{opacity:.7;font-size:12px;margin-top:11px}.badge{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:999px;background:#203246;font-size:12px;color:#b9d9ee}.legend{margin-top:8px;font-size:11px;opacity:.65}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">🐍 贪吃蛇 2.0</div><div class="stats"><div>得分 <span id="score">0</span></div><div>最高 <span id="high">0</span></div><div>等级 <span id="level">1</span></div><div>🪙 <span id="coins">0</span></div></div></div>
  <div class="card">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="bar"><button data-skin="classic">经典</button><button data-skin="neon">霓虹</button><button data-skin="fire">火焰</button></div>
    <div class="controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
    <div class="actions"><button id="restart">重新开始</button><button id="pause">暂停</button></div>
    <div class="hint">方向键 / WASD · 空格暂停 · 手机滑动</div>
    <div class="badge" id="status">准备出发！</div>
    <div class="legend">🔴 普通食物 +1　🟡 金色食物 +3　🔵 冰冻食物：短暂减速　🧱 3级后出现障碍</div>
  </div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),N=20,cell=24;
let snake,food,dir,nextDir,score,running,gameOver,timer,slowUntil=0,startX=0,startY=0,obstacles=[];
let high=Number(localStorage.getItem('snakeHighScore')||0),coins=Number(localStorage.getItem('snakeCoins')||0),skin=localStorage.getItem('snakeSkin')||'classic';
document.getElementById('high').textContent=high;document.getElementById('coins').textContent=coins;
const skins={classic:{head:'#b4ffd0',body:'#35c878',food:'#ff5b63'},neon:{head:'#fff36b',body:'#00e5ff',food:'#ff3df2'},fire:{head:'#fff0a8',body:'#ff7a18',food:'#ff3040'}};
function level(){return Math.floor(score/5)+1}function baseSpeed(){return Math.max(55,125-score*2)}function currentSpeed(){return Date.now()<slowUntil?baseSpeed()+65:baseSpeed()}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;running=true;gameOver=false;slowUntil=0;obstacles=[];document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;document.getElementById('pause').textContent='暂停';document.getElementById('status').textContent='开始！吃到特殊食物有惊喜';placeFood();clearInterval(timer);timer=setInterval(tick,currentSpeed());draw()}
function placeFood(){const types=['normal','normal','normal','gold','ice'];do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),type:types[Math.floor(Math.random()*types.length)]}}while(snake.some(p=>p.x===food.x&&p.y===food.y)||obstacles.some(p=>p.x===food.x&&p.y===food.y))}
function updateObstacles(){const lv=level();const target=Math.min(14,Math.max(0,(lv-2)*2));while(obstacles.length<target){const p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&!(food&&food.x===p.x&&food.y===p.y))obstacles.push(p)}}
function tick(){if(!running||gameOver)return;dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some((p,i)=>i>0&&p.x===head.x&&p.y===head.y)||obstacles.some(p=>p.x===head.x&&p.y===head.y)){gameOver=true;running=false;document.getElementById('status').textContent='💥 撞到了！最终得分 '+score;draw();return}
snake.unshift(head);if(head.x===food.x&&head.y===food.y){let gain=1;if(food.type==='gold')gain=3;score+=gain;coins+=gain;localStorage.setItem('snakeCoins',coins);document.getElementById('coins').textContent=coins;document.getElementById('score').textContent=score;document.getElementById('level').textContent=level();if(food.type==='gold')document.getElementById('status').textContent='🟡 金色食物！+3 分';else if(food.type==='ice'){slowUntil=Date.now()+5000;document.getElementById('status').textContent='🔵 冰冻效果！5秒减速'}else document.getElementById('status').textContent='吃到了！继续冲';if(score>high){high=score;localStorage.setItem('snakeHighScore',high);document.getElementById('high').textContent=high;document.getElementById('status').textContent='🏆 新纪录！ '+high}updateObstacles();placeFood();clearInterval(timer);timer=setInterval(tick,currentSpeed())}else snake.pop();draw()}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(d&&!(d.x===-dir.x&&d.y===-dir.y))nextDir=d}
function draw(){const s=skins[skin];ctx.clearRect(0,0,480,480);ctx.fillStyle='#08111b';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#ffffff09';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(480,i*cell);ctx.stroke()}
obstacles.forEach(p=>{ctx.fillStyle='#667789';ctx.fillRect(p.x*cell+3,p.y*cell+3,cell-6,cell-6);ctx.fillStyle='#9aa9b8';ctx.fillRect(p.x*cell+6,p.y*cell+6,5,5)});
const fc=food.type==='gold'?'#ffd43b':food.type==='ice'?'#53c9ff':s.food;ctx.shadowBlur=food.type==='ice'?18:14;ctx.shadowColor=fc;ctx.fillStyle=fc;ctx.beginPath();ctx.arc(food.x*cell+12,food.y*cell+12,food.type==='gold'?9:8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
snake.forEach((p,i)=>{ctx.fillStyle=i===0?s.head:s.body;ctx.beginPath();ctx.roundRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4,7);ctx.fill();if(i===0){ctx.fillStyle='#15202b';const ex=dir.x===1?17:dir.x===-1?7:10,ey=dir.y===1?17:dir.y===-1?7:10;ctx.beginPath();ctx.arc(p.x*cell+ex,p.y*cell+ey,2,0,Math.PI*2);ctx.fill()}});
if(gameOver||!running){ctx.fillStyle='#000a';ctx.fillRect(0,0,480,480);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px system-ui';ctx.fillText(gameOver?'游戏结束':'已暂停',240,225);ctx.font='18px system-ui';ctx.fillText(gameOver?'点击“重新开始”再挑战':'点击“继续”恢复游戏',240,261)}}
function togglePause(){if(gameOver)return;running=!running;document.getElementById('pause').textContent=running?'暂停':'继续';document.getElementById('status').textContent=running?'继续冲分！':'游戏暂停';draw()}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}if(e.key===' '){e.preventDefault();togglePause()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));document.getElementById('pause').onclick=togglePause;document.getElementById('restart').onclick=reset;
document.querySelectorAll('[data-skin]').forEach(b=>{b.onclick=()=>{skin=b.dataset.skin;localStorage.setItem('snakeSkin',skin);document.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('active',x.dataset.skin===skin));draw()}});
document.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('active',x.dataset.skin===skin));
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];startX=t.clientX;startY=t.clientY},{passive:true});canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')},{passive:true});
reset();
</script>
</body></html>
