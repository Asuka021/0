<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贪吃蛇 · 3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#294a65,#070b12 70%);font-family:system-ui,sans-serif;color:#fff}.wrap{width:min(95vw,600px)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.title{font-size:29px;font-weight:900}.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;font-weight:800}.stats span{color:#7df2a3}.card{padding:14px;background:#0b1220ee;border:1px solid #40566d;border-radius:22px;box-shadow:0 20px 60px #0009}canvas{display:block;width:100%;height:auto;background:#08111b;border-radius:15px;touch-action:none}.menu{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:11px 0}.button,.controls button,.actions button{border:0;border-radius:12px;background:#26384a;color:#fff;padding:9px 13px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #162330}.button:active,.controls button:active,.actions button:active{transform:translateY(3px);box-shadow:none}.button.hot{background:#315b48}.panel{display:none;background:#111d2b;border:1px solid #40566d;border-radius:15px;padding:12px;margin-top:10px;text-align:left}.panel.show{display:block}.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{padding:10px;border-radius:12px;background:#1c2a39;text-align:center}.item button{margin-top:7px;border:0;border-radius:9px;padding:6px 9px;background:#315b48;color:white;font-weight:700}.leader{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #ffffff12}.controls{margin-top:11px;display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:7px}.controls button{height:54px;font-size:23px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.actions{display:flex;gap:9px;justify-content:center;margin-top:12px}.actions button{height:43px}.skill{background:#624a1d!important}.hint{text-align:center;opacity:.7;font-size:11px;margin-top:10px}.status{text-align:center;display:inline-block;margin:8px auto 0;padding:5px 11px;border-radius:999px;background:#203246;font-size:12px}.statusbox{text-align:center}.hidden{display:none}
</style></head><body><div class="wrap"><div class="top"><div class="title">🐍 贪吃蛇 3.0</div><div class="stats"><div>分 <span id="score">0</span></div><div>最高 <span id="high">0</span></div><div>Lv.<span id="level">1</span></div><div>🪙 <span id="coins">0</span></div></div></div><div class="card">
<canvas id="game" width="480" height="480"></canvas>
<div class="menu"><button class="button hot" id="start">▶ 开始游戏</button><button class="button" id="shopBtn">🛒 商店</button><button class="button" id="rankBtn">🏆 排行榜</button><button class="button" id="soundBtn">🔊 音效</button></div>
<div class="panel" id="shop"><b>🛒 蛇蛇商店</b><p>金币：<span id="shopCoins">0</span>　购买皮肤后可在游戏中使用</p><div class="shopgrid" id="shopgrid"></div></div>
<div class="panel" id="rank"><b>🏆 本机排行榜</b><div id="leaders"></div></div>
<div class="controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
<div class="actions"><button id="pause">暂停</button><button id="skill" class="skill">⚡ 冲刺</button><button id="restart">重新开始</button></div>
<div class="hint">方向键 / WASD · 空格暂停 · 手机滑动 · 冲刺：短时间高速移动</div><div class="statusbox"><span class="status" id="status">点击“开始游戏”</span></div>
</div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),N=20,C=24;let snake,food,dir,nextDir,score,running=false,over=false,timer,obstacles=[],slowUntil=0,boostUntil=0,startX=0,startY=0,boss=null,bossHits=0;
let high=+localStorage.getItem('snakeHighScore')||0,coins=+localStorage.getItem('snakeCoins')||0,sound=localStorage.getItem('snakeSound')!=='off',skin=localStorage.getItem('snakeSkin')||'classic';
const owned=JSON.parse(localStorage.getItem('snakeOwned')||'["classic"]');const skins={classic:{name:'经典',cost:0,head:'#b4ffd0',body:'#35c878',food:'#ff5b63'},neon:{name:'霓虹',cost:15,head:'#fff36b',body:'#00e5ff',food:'#ff3df2'},fire:{name:'火焰',cost:30,head:'#fff0a8',body:'#ff7a18',food:'#ff3040'},ice:{name:'冰晶',cost:50,head:'#e8ffff',body:'#65bfff',food:'#a9f3ff'},shadow:{name:'暗影',cost:80,head:'#f0d5ff',body:'#8d55d9',food:'#ff63c8'},gold:{name:'黄金',cost:120,head:'#fff7a8',body:'#ffc52e',food:'#ffef69'}};
function ui(){scoreEl.textContent=score;highEl.textContent=high;levelEl.textContent=level();coinsEl.textContent=coins;shopCoins.textContent=coins;soundBtn.textContent=sound?'🔊 音效':'🔇 静音'}const scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),levelEl=document.getElementById('level'),coinsEl=document.getElementById('coins'),shopCoins=document.getElementById('shopCoins');ui();
function level(){return Math.floor(score/5)+1}function baseSpeed(){return Math.max(52,125-score*2)}function speed(){return Date.now()<slowUntil?baseSpeed()+75:Date.now()<boostUntil?35:baseSpeed()}
function beep(freq=500,dur=.06){if(!sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch(e){}}
function reset(start=false){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;over=false;running=start;slowUntil=boostUntil=0;obstacles=[];boss=null;bossHits=0;ui();status.textContent=start?'出发！吃特殊食物拿更多金币':'点击“开始游戏”';pause.textContent='暂停';clearInterval(timer);if(start)timer=setInterval(tick,speed());placeFood();draw()}
function placeFood(){const t=['normal','normal','normal','gold','ice','coin','coin'];do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),type:t[Math.floor(Math.random()*t.length)]}}while(snake.some(p=>p.x===food.x&&p.y===food.y)||obstacles.some(p=>p.x===food.x&&p.y===food.y)||(boss&&boss.x===food.x&&boss.y===food.y))}
function addObstacles(){const target=Math.min(16,Math.max(0,(level()-2)*2));while(obstacles.length<target){let p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&!obstacles.some(s=>s.x===p.x&&s.y===p.y))obstacles.push(p)}}
function maybeBoss(){if(level()>=8&&!boss){boss={x:17,y:17,dir:-1,hp:3};bossHits=0;status.textContent='👹 BOSS 出现！撞到它会受伤，吃掉3次即可击败';}}
function tick(){if(!running||over)return;dir={...nextDir};const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((p,i)=>i>0&&p.x===h.x&&p.y===h.y)||obstacles.some(p=>p.x===h.x&&p.y===h.y)){end();return}if(boss&&h.x===boss.x&&h.y===boss.y){boss.hp--;bossHits++;beep(180,.1);snake.unshift(h);snake.pop();if(boss.hp<=0){coins+=20;localStorage.setItem('snakeCoins',coins);status.textContent='👑 BOSS 击败！+20金币';boss=null;ui()}else status.textContent='💥 BOSS 受伤！还差 '+boss.hp+' 次';draw();return}
snake.unshift(h);if(h.x===food.x&&h.y===food.y){let gain=1,coinGain=1;if(food.type==='gold'){gain=3;coinGain=3;status.textContent='🟡 黄金食物 +3'}if(food.type==='ice'){slowUntil=Date.now()+5000;status.textContent='🔵 冰冻：5秒减速'}if(food.type==='coin'){gain=2;coinGain=5;status.textContent='🪙 金币宝箱 +5金币'}score+=gain;coins+=coinGain;localStorage.setItem('snakeCoins',coins);if(score>high){high=score;localStorage.setItem('snakeHighScore',high);status.textContent='🏆 新纪录！'}addObstacles();maybeBoss();ui();beep(food.type==='gold'?800:550,.06);placeFood();clearInterval(timer);timer=setInterval(tick,speed())}else snake.pop();draw()}
function end(){over=true;running=false;clearInterval(timer);if(score>0){let r=JSON.parse(localStorage.getItem('snakeRanks')||'[]');r.push({score,date:new Date().toLocaleDateString()});r.sort((a,b)=>b.score-a.score);localStorage.setItem('snakeRanks',JSON.stringify(r.slice(0,10)));}status.textContent='💥 游戏结束！得分 '+score;beep(120,.2);draw()}
function setDir(n){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[n];if(d&&!(d.x===-dir.x&&d.y===-dir.y))nextDir=d}
function draw(){const s=skins[skin];ctx.clearRect(0,0,480,480);ctx.fillStyle='#08111b';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#ffffff09';for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(480,i*C);ctx.stroke()}obstacles.forEach(p=>{ctx.fillStyle='#566879';ctx.fillRect(p.x*C+3,p.y*C+3,C-6,C-6);ctx.fillStyle='#91a4b6';ctx.fillRect(p.x*C+6,p.y*C+6,5,5)});const fc=food.type==='gold'?'#ffd43b':food.type==='ice'?'#53c9ff':food.type==='coin'?'#ffb72e':s.food;ctx.shadowBlur=16;ctx.shadowColor=fc;ctx.fillStyle=fc;ctx.beginPath();ctx.arc(food.x*C+12,food.y*C+12,food.type==='gold'?10:8,0,7);ctx.fill();ctx.shadowBlur=0;if(boss){ctx.fillStyle='#8f2f4f';ctx.beginPath();ctx.arc(boss.x*C+12,boss.y*C+12,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('👹',boss.x*C+12,boss.y*C+16);ctx.fillStyle='#f66';ctx.fillRect(boss.x*C+2,boss.y*C-3,20,3);ctx.fillStyle='#6f6';ctx.fillRect(boss.x*C+2,boss.y*C-3,20*(boss.hp/3),3)}snake.forEach((p,i)=>{ctx.fillStyle=i===0?s.head:s.body;ctx.beginPath();ctx.roundRect(p.x*C+2,p.y*C+2,C-4,C-4,7);ctx.fill();if(i===0){ctx.fillStyle='#15202b';ctx.beginPath();ctx.arc(p.x*C+12+dir.x*5+dir.y*4,p.y*C+12+dir.y*5+dir.x*4,2,0,7);ctx.fill()}});if(!running||over){ctx.fillStyle='#000b';ctx.fillRect(0,0,480,480);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 32px system-ui';ctx.fillText(over?'游戏结束':'准备开始',240,220);ctx.font='17px system-ui';ctx.fillText(over?'点击重新开始':'点击上方“开始游戏”',240,258)}}
function startGame(){if(over||!snake)reset(true);else{running=true;pause.textContent='暂停';status.textContent='继续冲分！';clearInterval(timer);timer=setInterval(tick,speed());draw()}}
start.onclick=startGame;pause.onclick=()=>{if(over)return;running=!running;pause.textContent=running?'暂停':'继续';status.textContent=running?'继续冲分！':'游戏暂停';draw()};restart.onclick=()=>reset(false);skill.onclick=()=>{if(!running||over)return;boostUntil=Date.now()+1800;status.textContent='⚡ 冲刺！1.8秒高速';beep(900,.08);clearInterval(timer);timer=setInterval(tick,speed())};soundBtn.onclick=()=>{sound=!sound;localStorage.setItem('snakeSound',sound?'on':'off');ui()};
document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};if(m[e.key]){e.preventDefault();setDir(m[e.key])}if(e.key===' '){e.preventDefault();pause.click()}if(e.key==='Shift')skill.click()});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(b.dataset.dir));canvas.addEventListener('touchstart',e=>{let t=e.touches[0];startX=t.clientX;startY=t.clientY},{passive:true});canvas.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});
shopBtn.onclick=()=>{shop.classList.toggle('show');rank.classList.remove('show');renderShop()};rankBtn.onclick=()=>{rank.classList.toggle('show');shop.classList.remove('show');renderRank()};function renderShop(){shopgrid.innerHTML='';Object.entries(skins).forEach(([id,s])=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+s.name+'</b><br>🪙 '+s.cost+'<br><button></button>';let b=d.querySelector('button');if(owned.includes(id)){b.textContent=skin===id?'已装备':'装备';b.onclick=()=>{skin=id;localStorage.setItem('snakeSkin',skin);status.textContent='🎨 已装备 '+s.name;renderShop();draw()}}else{b.textContent='购买';b.onclick=()=>{if(coins<s.cost){status.textContent='金币不够！';return}coins-=s.cost;owned.push(id);localStorage.setItem('snakeCoins',coins);localStorage.setItem('snakeOwned',JSON.stringify(owned));skin=id;localStorage.setItem('snakeSkin',skin);status.textContent='🎉 解锁 '+s.name;ui();renderShop();draw()}}shopgrid.appendChild(d)})}function renderRank(){let r=JSON.parse(localStorage.getItem('snakeRanks')||'[]');leaders.innerHTML=r.length?r.map((x,i)=>'<div class="leader"><span>#'+(i+1)+'　'+x.date+'</span><b>'+x.score+' 分</b></div>').join(''):'<p>还没有成绩，快去挑战！</p>'}
reset(false);
</script></body></html>
